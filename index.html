<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abey Bhaag!</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#65d8ff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* HUD */

.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.hudBox{
  background:#082b42ee;
  border:3px solid white;
  border-radius:14px;
  padding:7px 10px;
  color:white;
  font-weight:1000;
  box-shadow:0 4px 10px #0005;
}

.pauseBtn{
  position:absolute;
  top:65px;
  left:10px;
  z-index:11;
  width:48px;
  height:48px;
  border:3px solid white;
  border-radius:14px;
  background:#082b42ee;
  color:white;
  font-size:20px;
  font-weight:bold;
}

/* Mobile controls */

.controls{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:12;
  display:flex;
  gap:7px;
}

.controls button{
  width:56px;
  height:48px;
  border:3px solid white;
  border-radius:14px;
  background:#082b42e8;
  color:white;
  font-size:22px;
  font-weight:1000;
}

/* HOME */

.screen{
  position:absolute;
  inset:0;
  z-index:30;
}

#home{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#10a9ed,#dffaff 52%,#567d8b);
}

.homeBox{
  width:min(430px,94vw);
  text-align:center;
}

.logo{
  font-size:58px;
  line-height:.8;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-5px;
  color:#ffd51b;
  text-shadow:4px 5px #152b42,-2px -2px white;
}

.logo span{
  color:#08c5ff;
}

.subtitle{
  margin:17px auto 8px;
  display:inline-block;
  padding:8px 14px;
  border-radius:12px;
  border:3px solid #754900;
  background:#f5b31c;
  color:#17283b;
  font-weight:1000;
}

.coinBar{
  margin:8px auto 13px;
  display:inline-block;
  padding:7px 16px;
  border-radius:18px;
  background:#082b42ee;
  color:#ffd51b;
  border:3px solid white;
  font-weight:1000;
}

.playButton,
.storeButton{
  width:85%;
  display:block;
  margin:9px auto;
  padding:12px;
  border-radius:30px;
  font-weight:1000;
}

.playButton{
  border:5px solid white;
  background:linear-gradient(#fff32b,#ff8b00);
  color:#17283b;
  font-size:31px;
  box-shadow:0 7px #884300;
}

.storeButton{
  border:4px solid white;
  background:#082b42;
  color:white;
  font-size:20px;
}

/* STORE */

#store{
  display:none;
  overflow:auto;
  background:linear-gradient(#11a9ec,#e5fbff 55%,#577e8c);
}

.storeHeader{
  width:min(490px,94vw);
  margin:auto;
  padding:14px 5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.storeHeader h1{
  color:white;
  font-size:27px;
  text-shadow:2px 3px #173347;
}

.backBtn{
  border:3px solid white;
  border-radius:13px;
  padding:9px 13px;
  background:#082b42;
  color:white;
  font-weight:1000;
}

.storeCoins{
  text-align:center;
  color:#ffd51b;
  font-size:22px;
  font-weight:1000;
  margin-bottom:12px;
}

.storeGrid{
  width:min(490px,94vw);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding-bottom:25px;
}

.card{
  background:#082b42ee;
  border:3px solid #64d9ff;
  border-radius:18px;
  padding:8px;
  color:white;
  text-align:center;
}

.card.selected{
  border-color:#62ff51;
  box-shadow:0 0 18px #62ff5180;
}

.preview{
  height:145px;
  background:linear-gradient(#b9efff,#f4fdff);
  border-radius:13px;
  position:relative;
  overflow:hidden;
  margin-bottom:7px;
}

.miniShadow{
  position:absolute;
  width:65px;
  height:12px;
  background:#0003;
  border-radius:50%;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
}

.miniBody{
  position:absolute;
  width:70px;
  height:68px;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  border-radius:22px 22px 9px 9px;
}

.miniHead{
  position:absolute;
  width:53px;
  height:53px;
  border-radius:50%;
  top:27px;
  left:50%;
  transform:translateX(-50%);
  background:#ffd0aa;
  border:3px solid #925c42;
}

.miniHair{
  position:absolute;
  width:62px;
  height:40px;
  border-radius:50% 50% 25% 25%;
  top:19px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
}

.miniEyes{
  position:absolute;
  z-index:4;
  top:51px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  color:#182635;
}

.card h2{
  font-size:19px;
}

.price{
  color:#ffd51b;
  font-weight:1000;
  margin:5px;
}

.buy{
  width:100%;
  padding:9px;
  border:0;
  border-radius:11px;
  background:linear-gradient(#ffe52b,#ff9200);
  color:#17283b;
  font-weight:1000;
}

.buy.selected{
  background:#5be34e;
}

.buy.locked{
  background:#667984;
  color:white;
}

/* PAUSE */

#pauseMenu{
  display:none;
  align-items:center;
  justify-content:center;
  background:#0009;
}

.pauseBox{
  width:min(370px,90vw);
  background:#082b42;
  color:white;
  padding:23px;
  border-radius:22px;
  border:4px solid #55d7ff;
  text-align:center;
}

.pauseBox h1{
  color:#ffd51b;
  margin-bottom:15px;
}

.menuBtn{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:3px solid white;
  border-radius:14px;
  font-size:19px;
  font-weight:1000;
}

.resume{
  background:#57dc4b;
}

.openStore{
  background:#ffc928;
}

.homeBtn{
  background:#445d69;
  color:white;
}

/* GAME OVER */

#gameOver{
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
}

.overBox{
  width:min(390px,92vw);
  padding:25px;
  text-align:center;
  background:#082b42;
  border:4px solid #37c7ff;
  border-radius:23px;
  color:white;
}

.overBox h1{
  color:#ffd51b;
  font-size:39px;
}

.restart{
  width:100%;
  padding:12px;
  margin-top:16px;
  border:4px solid white;
  border-radius:17px;
  background:linear-gradient(#fff32b,#ff8b00);
  font-size:22px;
  font-weight:1000;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->

<div class="hud" id="hud">
  <div class="hudBox">⭐ <span id="score">00000</span></div>
  <div class="hudBox">🪙 <span id="coins">0</span></div>
  <div class="hudBox">🏃 <span id="distance">0</span>m</div>
</div>

<button class="pauseBtn" onclick="pauseGame()">⏸</button>

<div class="controls">
  <button onclick="moveLane(-1)">◀</button>
  <button onclick="jump()">⬆</button>
  <button onclick="slide()">⬇</button>
  <button onclick="moveLane(1)">▶</button>
</div>


<!-- HOME -->

<div id="home" class="screen">

  <div class="homeBox">

    <div class="logo">
      ABEY<br>
      <span>BHAAG!</span>
    </div>

    <div class="subtitle">
      Pakray gaye to Game Over! 🎮
    </div>

    <div class="coinBar">
      🪙 <span id="homeCoins">0</span>
    </div>

    <button class="playButton" onclick="startGame()">
      ▶ PLAY
    </button>

    <button class="storeButton" onclick="openStore('home')">
      🏪 CHARACTER STORE
    </button>

  </div>

</div>


<!-- STORE -->

<div id="store" class="screen">

  <div class="storeHeader">

    <button class="backBtn" onclick="closeStore()">
      ← BACK
    </button>

    <h1>CHARACTER STORE</h1>

  </div>

  <div class="storeCoins">
    🪙 <span id="storeCoins">0</span>
  </div>

  <div class="storeGrid" id="storeGrid"></div>

</div>


<!-- PAUSE MENU -->

<div id="pauseMenu" class="screen">

  <div class="pauseBox">

    <h1>GAME PAUSED</h1>

    <button class="menuBtn resume"
            onclick="resumeGame()">
      ▶ RESUME
    </button>

    <button class="menuBtn openStore"
            onclick="openStore('game')">
      🏪 CHARACTER STORE
    </button>

    <button class="menuBtn homeBtn"
            onclick="goHome()">
      🏠 HOME
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen">

  <div class="overBox">

    <h1>GAME OVER!</h1>

    <p style="margin-top:8px">
      Train/obstacle se takra gaye 😱
    </p>

    <p style="margin-top:12px">
      ⭐ Score: <b id="finalScore">0</b>
    </p>

    <p style="margin-top:5px">
      🪙 Coins: <b id="finalCoins">0</b>
    </p>

    <button class="restart" onclick="startGame()">
      🔄 RUN AGAIN
    </button>

    <button
      class="menuBtn"
      style="background:#ffc928;margin-top:8px"
      onclick="openStore('gameover')">
      🏪 STORE
    </button>

  </div>

</div>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,DPR;

function resize(){

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================
   CHARACTERS
========================================= */

const characters=[
  {
    id:"adrien",
    name:"Adrien",
    price:0,
    skin:"#ffd0aa",
    hair:"#26394d",
    shirt:"#17548b",
    pants:"#182c43",
    shoe:"#eeeeee"
  },
  {
    id:"doraemon",
    name:"Doraemon",
    price:500,
    skin:"#61acd2",
    hair:"#61acd2",
    shirt:"#198bc6",
    pants:"#198bc6",
    shoe:"#eeeeee"
  },
  {
    id:"mrbeast",
    name:"Mr Beast",
    price:1000,
    skin:"#ffd0aa",
    hair:"#49301e",
    shirt:"#168bd0",
    pants:"#202b36",
    shoe:"#ffffff"
  },
  {
    id:"ronaldo",
    name:"Ronaldo",
    price:2000,
    skin:"#eab08d",
    hair:"#20242a",
    shirt:"#d73535",
    pants:"#20242a",
    shoe:"#eeeeee"
  }
];


/* =========================================
   SAVE
========================================= */

let wallet=Number(localStorage.getItem("abeyCoins")||0);

let owned=JSON.parse(
  localStorage.getItem("abeyOwned")||
  '["adrien"]'
);

let selected=
  localStorage.getItem("abeySelected")||
  "adrien";

function save(){

  localStorage.setItem(
    "abeyCoins",
    wallet
  );

  localStorage.setItem(
    "abeyOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "abeySelected",
    selected
  );

  updateWallet();
}

function updateWallet(){

  document.getElementById("homeCoins").textContent=wallet;
  document.getElementById("storeCoins").textContent=wallet;
}


/* =========================================
   STORE
========================================= */

let returnTo="home";

function openStore(from="home"){

  returnTo=from;

  paused=true;

  document.getElementById("home").style.display="none";
  document.getElementById("gameOver").style.display="none";
  document.getElementById("pauseMenu").style.display="none";

  document.getElementById("store").style.display="block";

  renderStore();
}

function closeStore(){

  document.getElementById("store").style.display="none";

  if(returnTo==="game"){

    document.getElementById("pauseMenu").style.display="flex";

  }
  else if(returnTo==="gameover"){

    document.getElementById("gameOver").style.display="flex";

  }
  else{

    document.getElementById("home").style.display="flex";

  }

  updateWallet();
}

function renderStore(){

  const grid=document.getElementById("storeGrid");

  grid.innerHTML="";

  characters.forEach(c=>{

    const isOwned=owned.includes(c.id);
    const isSelected=selected===c.id;

    const card=document.createElement("div");

    card.className=
      "card"+(isSelected?" selected":"");

    card.innerHTML=`

      <div class="preview">

        <div class="miniShadow"></div>

        <div
          class="miniHair"
          style="background:${c.hair}">
        </div>

        <div
          class="miniHead"
          style="background:${c.skin}">
        </div>

        <div class="miniEyes">●　●</div>

        <div
          class="miniBody"
          style="background:${c.shirt}">
        </div>

      </div>

      <h2>${c.name}</h2>

      <div class="price">
        ${isOwned?"OWNED":"🪙 "+c.price}
      </div>

      <button class="buy ${
        isSelected?"selected":
        !isOwned?"locked":""
      }">

        ${
          isSelected
          ?"✓ SELECTED"
          :isOwned
          ?"SELECT"
          :"🪙 BUY"
        }

      </button>
    `;

    card.querySelector(".buy").onclick=()=>{

      if(!isOwned){

        if(wallet<c.price){

          alert(
            "Coins kam hain! 🪙\n"+
            "Game khel kar coins collect karo."
          );

          return;
        }

        wallet-=c.price;
        owned.push(c.id);
        selected=c.id;

        save();
        renderStore();

        return;
      }

      selected=c.id;

      save();
      renderStore();
    };

    grid.appendChild(card);
  });
}

updateWallet();


/* =========================================
   GAME VARIABLES
========================================= */

let running=false;
let paused=false;

let score=0;
let collectedCoins=0;
let distance=0;

let speed=.006;
let world=0;

let objects=[];
let spawnTimer=0;

let currentLane=1;
let targetLane=1;

let action="";
let actionStart=0;
let actionEnd=0;

let runTime=0;

let lastTime=0;
let animation=0;


/* =========================================
   START
========================================= */

function startGame(){

  document.getElementById("home").style.display="none";
  document.getElementById("store").style.display="none";
  document.getElementById("pauseMenu").style.display="none";
  document.getElementById("gameOver").style.display="none";

  running=true;
  paused=false;

  score=0;
  collectedCoins=0;
  distance=0;

  speed=.006;
  world=0;

  objects=[];

  spawnTimer=10;

  currentLane=1;
  targetLane=1;

  action="";

  runTime=0;

  lastTime=performance.now();

  cancelAnimationFrame(animation);

  animation=requestAnimationFrame(loop);
}


/* =========================================
   GAME LOOP
========================================= */

function loop(now){

  if(!running)
    return;

  const dt=Math.min(
    2,
    (now-lastTime)/16.67
  );

  lastTime=now;

  if(!paused){

    update(dt,now);
    draw();

  }

  animation=requestAnimationFrame(loop);
}


/* =========================================
   PAUSE + STORE
========================================= */

function pauseGame(){

  if(!running)
    return;

  paused=true;

  document.getElementById(
    "pauseMenu"
  ).style.display="flex";
}

function resumeGame(){

  paused=false;

  document.getElementById(
    "pauseMenu"
  ).style.display="none";

  lastTime=performance.now();
}

function goHome(){

  running=false;
  paused=false;

  document.getElementById("pauseMenu").style.display="none";
  document.getElementById("gameOver").style.display="none";
  document.getElementById("store").style.display="none";
  document.getElementById("home").style.display="flex";

  updateWallet();
}


/* =========================================
   PLAYER CONTROLS
========================================= */

function moveLane(dir){

  if(!running||paused)
    return;

  targetLane+=dir;

  targetLane=Math.max(
    0,
    Math.min(2,targetLane)
  );
}

function jump(){

  if(!running||paused||action)
    return;

  action="jump";
  actionStart=performance.now();
  actionEnd=actionStart+760;
}

function slide(){

  if(!running||paused||action)
    return;

  action="slide";
  actionStart=performance.now();
  actionEnd=actionStart+650;
}


/* =========================================
   KEYBOARD
========================================= */

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft")
    moveLane(-1);

  if(e.key==="ArrowRight")
    moveLane(1);

  if(e.key==="ArrowUp" || e.key===" ")
    jump();

  if(e.key==="ArrowDown")
    slide();

  if(e.key==="Escape")
    pauseGame();
});


/* =========================================
   TOUCH
========================================= */

let touchX=0;
let touchY=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  e=>{

    const t=e.changedTouches[0];

    const dx=t.clientX-touchX;
    const dy=t.clientY-touchY;

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<25
    )
      return;

    if(Math.abs(dx)>Math.abs(dy))
      moveLane(dx>0?1:-1);
    else if(dy<0)
      jump();
    else
      slide();

  },
  {passive:true}
);


/* =========================================
   UPDATE
========================================= */

function update(dt,now){

  runTime+=dt;

  /* REAL WORLD MOVEMENT */

  world+=speed*100*dt;

  /* REAL RUN SPEED */

  speed=Math.min(
    .017,
    speed+.0000015*dt
  );

  /* character lane movement */

  currentLane+=(targetLane-currentLane)
    *.19*dt;

  /* action */

  if(action && now>actionEnd)
    action="";


  /* score */

  score+=Math.floor(1.7*dt);

  distance+=Math.floor(
    speed*15*dt
  );


  /* spawn */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnObject();

    spawnTimer=
      Math.max(
        25,
        48-speed*850
      )+
      Math.random()*25;
  }


  /* objects */

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o=objects[i];

    o.z+=speed*dt;

    if(
      o.z>.78 &&
      o.z<1.02 &&
      Math.abs(
        o.lane-currentLane
      )<.27 &&
      !o.checked
    ){

      o.checked=true;

      if(o.type==="coin"){

        collectedCoins++;

        objects.splice(i,1);

        continue;
      }


      let safe=false;


      if(
        o.type==="barrier" &&
        action==="jump"
      )
        safe=true;


      if(
        o.type==="train" &&
        action==="jump"
      )
        safe=true;


      if(
        o.type==="lowbar" &&
        action==="slide"
      )
        safe=true;


      if(!safe){

        gameOver();

        return;
      }
    }


    if(o.z>1.15)
      objects.splice(i,1);
  }


  document.getElementById("score").textContent=
    String(score).padStart(5,"0");

  document.getElementById("coins").textContent=
    collectedCoins;

  document.getElementById("distance").textContent=
    distance;
}


/* =========================================
   SPAWN
========================================= */

function spawnObject(){

  const lane=Math.floor(Math.random()*3);

  const r=Math.random();

  let type;

  if(r<.43)
    type="coin";
  else if(r<.68)
    type="barrier";
  else if(r<.86)
    type="train";
  else
    type="lowbar";


  objects.push({
    type,
    lane,
    z:-.08,
    checked:false,
    spin:Math.random()*10
  });


  /* coin chain */

  if(type==="coin"){

    for(let i=1;i<5;i++){

      objects.push({
        type:"coin",
        lane,
        z:-.08-i*.075,
        checked:false,
        spin:i
      });

    }
  }


  /* obstacle side coins */

  if(type!=="coin"){

    const side=
      lane===0?1:
      lane===2?1:
      Math.random()<.5?0:2;

    for(let i=0;i<3;i++){

      objects.push({
        type:"coin",
        lane:side,
        z:-.18-i*.08,
        checked:false,
        spin:i
      });
    }
  }
}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

  running=false;

  wallet+=collectedCoins;

  save();

  document.getElementById("finalScore")
    .textContent=score;

  document.getElementById("finalCoins")
    .textContent=collectedCoins;

  document.getElementById("gameOver")
    .style.display="flex";
}


/* =========================================
   PERSPECTIVE
========================================= */

function roadY(z){

  /*
    Dynamic camera.
    Is wajah se road ka view
    continuously change hota hai.
  */

  const cameraWave=
    Math.sin(world*.018)*7;

  return H*.37+
    (H*.97-H*.37)*z+
    cameraWave*z;
}

function roadWidth(z){

  return W*.13+
    (W*.79-W*.13)*z;
}

function laneX(lane,z){

  /*
    Road curves slightly.
  */

  const curve=
    Math.sin(
      world*.012+z*2
    )*
    W*.025*
    z;

  return W/2+
    curve+
    (lane-1)*
    roadWidth(z)*.62;
}


/* =========================================
   DRAW
========================================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawSky();
  drawCity();
  drawRoad();
  drawTracks();
  drawStreetLights();
  drawObjects();
  drawPlayer();
  drawCrowd();
}


/* =========================================
   SKY
========================================= */

function drawSky(){

  const g=ctx.createLinearGradient(
    0,0,0,H*.55
  );

  g.addColorStop(0,"#0da9ee");
  g.addColorStop(1,"#e2faff");

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H*.56
  );


  /* sun */

  ctx.fillStyle="#ffe66b";

  ctx.beginPath();

  ctx.arc(
    W*.82,
    H*.11,
    29,
    0,
    Math.PI*2
  );

  ctx.fill();


  cloud(W*.17,H*.14,1);
  cloud(W*.57,H*.20,.75);
}


function cloud(x,y,s){

  ctx.fillStyle="#ffffffaa";

  ctx.beginPath();

  ctx.arc(x,y,18*s,0,Math.PI*2);
  ctx.arc(x+20*s,y-8*s,24*s,0,Math.PI*2);
  ctx.arc(x+44*s,y,18*s,0,Math.PI*2);

  ctx.fill();
}


/* =========================================
   CITY
========================================= */

function drawCity(){

  const move=(world*.025)%95;

  for(let i=-2;i<13;i++){

    const x=i*90-move;

    const h=60+((i*41)%90+90)%90;

    ctx.fillStyle="#6f96a5";

    ctx.fillRect(
      x,
      H*.43-h,
      78,
      h
    );


    ctx.fillStyle="#d8f3f7";

    for(let r=0;r<4;r++){

      for(let c=0;c<2;c++){

        ctx.fillRect(
          x+13+c*29,
          H*.43-h+14+r*22,
          11,
          8
        );
      }
    }
  }


  const move2=(world*.045)%125;

  for(let i=-2;i<11;i++){

    const x=i*120-move2;

    const h=80+((i*53)%110+110)%110;

    ctx.fillStyle="#537c91";

    ctx.fillRect(
      x,
      H*.44-h,
      105,
      h
    );


    ctx.fillStyle="#cdeaf1";

    for(let r=0;r<5;r++){

      for(let c=0;c<2;c++){

        ctx.fillRect(
          x+18+c*38,
          H*.44-h+17+r*25,
          13,
          9
        );
      }
    }
  }
}


/* =========================================
   ROAD
========================================= */

function drawRoad(){

  const horizon=H*.37;

  /* ground */

  ctx.fillStyle="#8e9795";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );


  /* road */

  ctx.fillStyle="#3d454b";

  ctx.beginPath();

  ctx.moveTo(
    W*.27,
    horizon
  );

  ctx.lineTo(
    W*.73,
    horizon
  );

  ctx.lineTo(
    W*1.10,
    H
  );

  ctx.lineTo(
    -W*.10,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* road edges */

  ctx.strokeStyle="#ffffff";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(W*.27,horizon);
  ctx.lineTo(-W*.10,H);

  ctx.moveTo(W*.73,horizon);
  ctx.lineTo(W*1.10,H);

  ctx.stroke();


  /* LANE MARKINGS */

  for(const line of [-.16,.16]){

    for(let i=0;i<18;i++){

      const z=
        (i*.075+world*.0018)%1;

      const y=roadY(z);

      const x=
        W/2+
        line*2*roadWidth(z);

      const len=
        7+z*31;

      ctx.fillStyle="#ffffff";

      ctx.fillRect(
        x-2,
        y,
        4,
        len
      );
    }
  }
}


/* =========================================
   RAILWAY TRACKS
========================================= */

function drawTracks(){

  /*
    Moving railway tracks on both sides
    to give proper runner environment.
  */

  for(const side of [-1,1]){

    const base=W/2+side*roadWidth(1)*.74;

    ctx.strokeStyle="#2d3940";
    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
      W/2+side*roadWidth(0)*.74,
      H*.39
    );

    ctx.lineTo(
      base,
      H
    );

    ctx.stroke();


    ctx.strokeStyle="#b5bdc0";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
      W/2+side*roadWidth(0)*.87,
      H*.39
    );

    ctx.lineTo(
      W/2+side*roadWidth(1)*.87,
      H
    );

    ctx.stroke();


    /* sleepers */

    for(let i=0;i<22;i++){

      const z=
        (i*.055+world*.0017)%1;

      const y=roadY(z);

      const rw=roadWidth(z);

      const x=W/2+side*rw*.80;

      ctx.fillStyle="#654d3c";

      ctx.fillRect(
        x-18*z,
        y,
        36*z+3,
        5
      );
    }
  }
}


/* =========================================
   STREET LIGHTS
========================================= */

function drawStreetLights(){

  const offset=(world*.11)%120;

  for(let i=-2;i<10;i++){

    const y=H*.39+i*120+offset;

    if(y<H*.42||y>H*.95)
      continue;

    const z=Math.min(
      1,
      Math.max(
        .1,
        (y-H*.39)/(H*.61)
      )
    );

    const s=.3+z*.9;

    drawLamp(31,y,s);
    drawLamp(W-31,y+18,s);
  }
}

function drawLamp(x,y,s){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.strokeStyle="#304754";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(0,-92);
  ctx.lineTo(20,-92);

  ctx.stroke();

  ctx.fillStyle="#ffe96b";

  ctx.beginPath();

  ctx.arc(
    20,
    -92,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================
   OBJECTS
========================================= */

function drawObjects(){

  objects
    .slice()
    .sort((a,b)=>a.z-b.z)
    .forEach(o=>{

      const z=Math.max(0,Math.min(1,o.z));

      const x=laneX(o.lane,z);

      const y=roadY(z);

      const scale=.27+z*1.25;

      ctx.save();

      ctx.translate(x,y);
      ctx.scale(scale,scale);

      if(o.type==="coin")
        drawCoin(o);

      if(o.type==="barrier")
        drawBarrier();

      if(o.type==="train")
        drawTrain();

      if(o.type==="lowbar")
        drawLowBar();

      ctx.restore();
    });
}


/* =========================================
   COIN
========================================= */

function drawCoin(o){

  const spin=
    Math.sin(
      world*.09+o.spin
    );

  const width=
    Math.max(
      4,
      22*Math.abs(spin)
    );

  ctx.fillStyle="#ffc719";
  ctx.strokeStyle="#fff3a3";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.ellipse(
    0,
    -15,
    width,
    28,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();

  if(width>10){

    ctx.fillStyle="#9b6100";
    ctx.font="bold 21px Arial";
    ctx.textAlign="center";

    ctx.fillText("★",0,-8);
  }
}


/* =========================================
   BARRIER
========================================= */

function drawBarrier(){

  ctx.fillStyle="#0006";

  ctx.beginPath();

  ctx.ellipse(
    0,
    22,
    46,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#263744";

  ctx.fillRect(-34,-32,8,55);
  ctx.fillRect(26,-32,8,55);


  ctx.fillStyle="#f5f1e6";

  ctx.fillRect(
    -43,
    -49,
    86,
    55
  );


  ctx.fillStyle="#e34239";

  for(let x=-48;x<50;x+=23){

    ctx.save();

    ctx.translate(x,-49);
    ctx.rotate(-.55);

    ctx.fillRect(
      0,
      0,
      15,
      75
    );

    ctx.restore();
  }


  ctx.strokeStyle="#253946";
  ctx.lineWidth=4;

  ctx.strokeRect(
    -43,
    -49,
    86,
    55
  );
}


/* =========================================
   TRAIN
========================================= */

function drawTrain(){

  /* shadow */

  ctx.fillStyle="#0007";

  ctx.beginPath();

  ctx.ellipse(
    0,
    35,
    54,
    11,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* body */

  const g=ctx.createLinearGradient(
    -45,-110,
    45,40
  );

  g.addColorStop(0,"#58d2f5");
  g.addColorStop(.5,"#0789c9");
  g.addColorStop(1,"#06466e");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.roundRect(
    -42,
    -108,
    84,
    143,
    13
  );

  ctx.fill();


  /* roof */

  ctx.fillStyle="#16394e";

  ctx.beginPath();

  ctx.roundRect(
    -47,
    -115,
    94,
    19,
    8
  );

  ctx.fill();


  /* front glass */

  ctx.fillStyle="#08283e";

  ctx.beginPath();

  ctx.roundRect(
    -32,
    -82,
    64,
    51,
    9
  );

  ctx.fill();


  ctx.fillStyle="#b9edf8";

  ctx.beginPath();

  ctx.moveTo(-25,-74);
  ctx.lineTo(-5,-74);
  ctx.lineTo(-11,-40);
  ctx.lineTo(-27,-40);
  ctx.closePath();

  ctx.fill();

  ctx.fillRect(4,-73,21,32);


  /* lights */

  ctx.fillStyle="#fff1a0";

  ctx.beginPath();

  ctx.arc(-25,7,9,0,Math.PI*2);
  ctx.arc(25,7,9,0,Math.PI*2);

  ctx.fill();


  ctx.fillStyle="#ffffff";

  ctx.beginPath();

  ctx.arc(-25,7,4,0,Math.PI*2);
  ctx.arc(25,7,4,0,Math.PI*2);

  ctx.fill();


  /* bumper */

  ctx.fillStyle="#0c3046";

  ctx.fillRect(
    -42,
    22,
    84,
    13
  );


  /* wheels */

  ctx.fillStyle="#1e272d";

  ctx.beginPath();

  ctx.arc(-28,34,10,0,Math.PI*2);
  ctx.arc(28,34,10,0,Math.PI*2);

  ctx.fill();
}


/* =========================================
   LOW BAR
========================================= */

function drawLowBar(){

  ctx.fillStyle="#202d35";

  ctx.fillRect(
    -43,
    -80,
    7,
    103
  );

  ctx.fillRect(
    36,
    -80,
    7,
    103
  );

  ctx.fillStyle="#ef3d3d";

  ctx.fillRect(
    -47,
    -80,
    94,
    18
  );

  ctx.fillStyle="#ffffff";

  for(let x=-40;x<45;x+=22){

    ctx.save();

    ctx.translate(x,-80);
    ctx.rotate(-.5);

    ctx.fillRect(
      0,
      0,
      11,
      25
    );

    ctx.restore();
  }
}


/* =========================================
   PLAYER — REAL RUNNING ANIMATION
========================================= */

function drawPlayer(){

  const c=
    characters.find(
      x=>x.id===selected
    )||characters[0];


  /*
    THIS IS THE IMPORTANT PART:

    Character body itself moves up/down,
    arms swing opposite,
    legs move independently,
    torso rotates slightly.
  */

  const runningSpeed=
    0.55+
    speed*45;


  const cycle=
    runTime*runningSpeed;


  const legSwing=
    Math.sin(cycle)*23;

  const oppositeLeg=
    Math.sin(cycle+Math.PI)*23;

  const armSwing=
    Math.sin(cycle+Math.PI)*18;

  const oppositeArm=
    Math.sin(cycle)*18;


  let jumpOffset=0;
  let squash=1;


  if(action==="jump"){

    const p=
      Math.min(
        1,
        Math.max(
          0,
          (performance.now()-actionStart)/760
        )
      );

    jumpOffset=
      Math.sin(p*Math.PI)*105;

    squash=1.04;
  }


  if(action==="slide"){

    squash=.72;
  }


  /*
    CHARACTER moves vertically with each
    running step — not just the road.
  */

  const bodyBounce=
    action
    ? 0
    : Math.abs(
        Math.sin(cycle)
      )*4;


  const x=
    laneX(
      currentLane,
      .91
    );


  let y=
    H*.775-
    bodyBounce-
    jumpOffset;


  if(action==="slide")
    y+=23;


  ctx.save();

  ctx.translate(x,y);

  ctx.scale(
    squash,
    squash
  );


  /* shadow */

  ctx.fillStyle="#0005";

  ctx.beginPath();

  ctx.ellipse(
    0,
    67,
    38,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* LEGS */

  ctx.lineCap="round";
  ctx.lineWidth=14;

  ctx.strokeStyle=c.pants;

  ctx.beginPath();

  ctx.moveTo(-10,17);
  ctx.lineTo(
    -18-legSwing*.45,
    52
  );

  ctx.moveTo(10,17);
  ctx.lineTo(
    18-oppositeLeg*.45,
    52
  );

  ctx.stroke();


  /* shoes */

  ctx.strokeStyle=c.shoe;
  ctx.lineWidth=10;

  ctx.beginPath();

  ctx.moveTo(
    -18-legSwing*.45,
    52
  );

  ctx.lineTo(
    -2-legSwing*.45,
    54
  );

  ctx.moveTo(
    18-oppositeLeg*.45,
    52
  );

  ctx.lineTo(
    38-oppositeLeg*.45,
    54
  );

  ctx.stroke();


  /* TORSO */

  ctx.fillStyle=c.shirt;

  ctx.beginPath();

  ctx.roundRect(
    -29,
    -37,
    58,
    64,
    18
  );

  ctx.fill();


  /* torso highlight */

  ctx.fillStyle="#ffffff28";

  ctx.beginPath();

  ctx.roundRect(
    -20,
    -29,
    11,
    48,
    6
  );

  ctx.fill();


  /* neck */

  ctx.fillStyle=c.skin;

  ctx.fillRect(
    -9,
    -44,
    18,
    16
  );


  /* HEAD */

  if(c.id==="doraemon"){

    ctx.fillStyle="#5faed5";

  }else{

    ctx.fillStyle=c.skin;
  }


  ctx.beginPath();

  ctx.arc(
    0,
    -66,
    29,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* EARS */

  if(c.id!=="doraemon"){

    ctx.beginPath();

    ctx.arc(
      -28,
      -65,
      8,
      0,
      Math.PI*2
    );

    ctx.arc(
      28,
      -65,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  /* HAIR */

  if(c.id!=="doraemon"){

    ctx.fillStyle=c.hair;

    ctx.beginPath();

    ctx.arc(
      0,
      -78,
      31,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();


    for(let i=-2;i<=2;i++){

      ctx.beginPath();

      ctx.arc(
        i*9,
        -86+Math.abs(i)*2,
        10,
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }


  /* DORAEMON FACE */

  if(c.id==="doraemon"){

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(-11,-67,10,0,Math.PI*2);
    ctx.arc(11,-67,10,0,Math.PI*2);

    ctx.fill();


    ctx.fillStyle="#101820";

    ctx.beginPath();

    ctx.arc(-11,-67,4,0,Math.PI*2);
    ctx.arc(11,-67,4,0,Math.PI*2);

    ctx.fill();


    ctx.fillStyle="#ed3e45";

    ctx.beginPath();

    ctx.arc(0,-54,6,0,Math.PI*2);

    ctx.fill();


    ctx.strokeStyle="#172a35";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(0,-47,12,.15,Math.PI-.15);

    ctx.stroke();


    /* whiskers */

    ctx.strokeStyle="#243b46";
    ctx.lineWidth=1.5;

    for(let i=-1;i<=1;i++){

      ctx.beginPath();

      ctx.moveTo(-7,-53+i*5);
      ctx.lineTo(-26,-49+i*6);

      ctx.moveTo(7,-53+i*5);
      ctx.lineTo(26,-49+i*6);

      ctx.stroke();
    }

  }

  else{

    /* eyes */

    ctx.fillStyle="#172433";

    ctx.beginPath();

    ctx.ellipse(
      -10,
      -64,
      4.5,
      6.5,
      0,
      0,
      Math.PI*2
    );

    ctx.ellipse(
      10,
      -64,
      4.5,
      6.5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* eyebrows */

    ctx.strokeStyle=c.hair;

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(-16,-73);
    ctx.lineTo(-6,-75);

    ctx.moveTo(6,-75);
    ctx.lineTo(16,-73);

    ctx.stroke();


    /* nose */

    ctx.fillStyle="#c98565";

    ctx.beginPath();

    ctx.arc(
      0,
      -54,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* smile */

    ctx.strokeStyle="#713d37";

    ctx.lineWidth=2.5;

    ctx.beginPath();

    ctx.arc(
      0,
      -49,
      10,
      .1,
      Math.PI-.1
    );

    ctx.stroke();
  }


  /* ARMS — actually swinging */

  ctx.strokeStyle=c.skin;

  ctx.lineWidth=13;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-23,-13);

  ctx.lineTo(
    -43,
    5+armSwing*.55
  );


  ctx.moveTo(23,-13);

  ctx.lineTo(
    43,
    -5-oppositeArm*.55
  );

  ctx.stroke();


  /* hands */

  ctx.fillStyle=c.skin;

  ctx.beginPath();

  ctx.arc(
    -43,
    5+armSwing*.55,
    7,
    0,
    Math.PI*2
  );

  ctx.arc(
    43,
    -5-oppositeArm*.55,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* DORAEMON BELLY */

  if(c.id==="doraemon"){

    ctx.fillStyle="#e8f8fc";

    ctx.beginPath();

    ctx.arc(
      0,
      3,
      17,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* pocket */

    ctx.strokeStyle="#4d9cbe";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      6,
      10,
      0,
      Math.PI
    );

    ctx.stroke();
  }


  ctx.restore();
}


/* =========================================
   CROWD
========================================= */

function drawCrowd(){

  const offset=(world*.018)%55;

  for(let i=-1;i<12;i++){

    const x=i*(W/10)+offset;

    const y=H*.985;

    ctx.fillStyle=
      i%2
      ? "#172730"
      : "#3d4b53";

    ctx.beginPath();

    ctx.arc(
      x,
      y-29,
      17,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ffd0aa";

    ctx.beginPath();

    ctx.arc(
      x,
      y-35,
      9,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* waving arms */

    if(i%3===0){

      const wave=
        Math.sin(
          runTime*.2+i
        )*10;

      ctx.strokeStyle="#ffd0aa";
      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.moveTo(
        x+9,
        y-23
      );

      ctx.lineTo(
        x+23,
        y-51+wave
      );

      ctx.stroke();
    }
  }
}


/* =========================================
   FIRST FRAME
========================================= */

draw();

</script>

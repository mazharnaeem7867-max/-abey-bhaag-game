<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Street Runner</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#72d9f2;
  font-family:Arial,sans-serif;
  touch-action:none
}
canvas{
  display:block;
  width:100%;
  height:100%
}
#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  pointer-events:none
}
.hudBox{
  background:#173746ee;
  color:white;
  padding:9px 13px;
  border:2px solid white;
  border-radius:14px;
  font-weight:bold;
  box-shadow:0 3px 8px #0005
}
#pause{
  position:fixed;
  top:65px;
  left:12px;
  z-index:6;
  width:48px;
  height:44px;
  border:2px solid white;
  border-radius:12px;
  background:#173746;
  color:white;
  font-size:20px
}
#controls{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  display:flex;
  gap:7px
}
#controls button{
  width:55px;
  height:47px;
  border:2px solid white;
  border-radius:13px;
  background:#173746dd;
  color:white;
  font-size:21px;
  font-weight:bold
}
.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center
}
#home{
  background:linear-gradient(
    #39c9ed 0%,
    #d9f8ff 53%,
    #737f82 53%,
    #303d42 100%
  )
}
.panel{
  width:min(430px,92vw);
  background:#173746ef;
  color:white;
  border:3px solid white;
  border-radius:24px;
  padding:23px;
  text-align:center;
  box-shadow:0 12px 35px #0008
}
.logo{
  font-size:48px;
  line-height:.85;
  font-weight:1000;
  font-style:italic;
  color:#ffd52a;
  text-shadow:3px 4px #173746
}
.logo span{color:#11c6eb}
.play,.storeButton,.menuButton{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:3px solid white;
  border-radius:16px;
  font-size:19px;
  font-weight:1000
}
.play{
  background:linear-gradient(#fff238,#ff9700)
}
.storeButton{
  background:#079fc8;
  color:white
}
.menuButton{
  background:#ffcc25
}
.resume{background:#64dc62}
.homeButton{
  background:#56676c;
  color:white
}
#store,#pauseScreen,#gameOver{
  display:none;
  background:#0009
}
#store{
  overflow:auto;
  align-items:flex-start;
  padding:12px
}
.storeWrap{
  width:min(500px,94vw);
  margin:auto
}
.storeHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:white
}
.back{
  border:2px solid white;
  border-radius:12px;
  background:#173746;
  color:white;
  padding:9px 12px;
  font-weight:bold
}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
  padding-bottom:20px
}
.card{
  background:#173746f2;
  border:2px solid #63dff5;
  border-radius:17px;
  padding:8px;
  text-align:center;
  color:white
}
.card.selected{
  border-color:#61e35d;
  box-shadow:0 0 14px #61e35d77
}
.avatar{
  height:145px;
  border-radius:12px;
  background:linear-gradient(#e2faff,#fff);
  position:relative;
  overflow:hidden
}
.head{
  position:absolute;
  width:54px;
  height:54px;
  border-radius:50%;
  left:50%;
  top:24px;
  transform:translateX(-50%);
  border:2px solid #68493b
}
.hair{
  position:absolute;
  width:62px;
  height:37px;
  border-radius:50%;
  left:50%;
  top:16px;
  transform:translateX(-50%)
}
.body{
  position:absolute;
  width:60px;
  height:67px;
  border-radius:19px 19px 10px 10px;
  left:50%;
  bottom:17px;
  transform:translateX(-50%)
}
.card h3{
  margin:7px 0 3px;
  font-size:16px
}
.price{
  display:block;
  color:#ffd52a;
  font-weight:bold;
  margin-bottom:5px
}
.buy{
  width:100%;
  padding:8px;
  border:0;
  border-radius:10px;
  background:#ffcc25;
  font-weight:bold
}
.buy.selected{background:#62df60}
.buy.owned{
  background:#0aaed5;
  color:white
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="hudBox">⭐ <span id="score">0</span></div>
  <div class="hudBox">🪙 <span id="coins">450</span></div>
  <div class="hudBox">📏 <span id="distance">0</span>m</div>
</div>

<button id="pause">⏸</button>

<div id="controls">
  <button onclick="moveLeft()">◀</button>
  <button onclick="jump()">⬆</button>
  <button onclick="slide()">⬇</button>
  <button onclick="moveRight()">▶</button>
</div>

<div id="home" class="screen">
  <div class="panel">
    <div class="logo">
      STREET<br>
      <span>RUNNER</span>
    </div>

    <p>RUN • JUMP • SLIDE • COLLECT</p>
    <p>🪙 Starting Coins: <b id="homeCoins">450</b></p>

    <button class="play" onclick="startGame()">▶ PLAY</button>
    <button class="storeButton" onclick="openStore('home')">
      🏪 CHARACTER STORE
    </button>
  </div>
</div>

<div id="store" class="screen">
  <div class="storeWrap">

    <div class="storeHeader">
      <button class="back" onclick="closeStore()">← BACK</button>
      <h2>CHARACTER STORE</h2>
      <b>🪙 <span id="storeCoins">450</span></b>
    </div>

    <div class="cards" id="characterCards"></div>

  </div>
</div>

<div id="pauseScreen" class="screen">
  <div class="panel">
    <h2>GAME PAUSED</h2>

    <button class="menuButton resume" onclick="resumeGame()">
      ▶ RESUME
    </button>

    <button class="menuButton" onclick="openStore('game')">
      🏪 STORE
    </button>

    <button class="menuButton homeButton" onclick="goHome()">
      🏠 HOME
    </button>
  </div>
</div>

<div id="gameOver" class="screen">
  <div class="panel">
    <h2>GAME OVER</h2>

    <p>⭐ Score: <b id="finalScore">0</b></p>
    <p>🪙 Coins Collected: <b id="finalCoins">0</b></p>

    <button class="play" onclick="startGame()">
      🔄 RUN AGAIN
    </button>

    <button class="storeButton" onclick="openStore('over')">
      🏪 STORE
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================
   BASIC THREE.JS SETUP
========================= */

const canvas=document.getElementById("gameCanvas");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x7edff4);

scene.fog=new THREE.Fog(
  0x7edff4,
  45,
  170
);

const camera=new THREE.PerspectiveCamera(
  58,
  innerWidth/innerHeight,
  .1,
  300
);

camera.position.set(0,5.3,10);

const renderer=new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;


/* =========================
   LIGHTS
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xdfffff,
    0x43535b,
    2.2
  )
);

const sunlight=
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sunlight.position.set(
  -30,
  45,
  20
);

sunlight.castShadow=true;

scene.add(sunlight);


/* =========================
   MATERIAL HELPERS
========================= */

function material(color,rough=.8,metal=0){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:rough,
    metalness:metal
  });
}

function cube(
  w,h,d,
  mat,
  x=0,y=0,z=0
){
  const mesh=
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      mat
    );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;
}


/* =========================
   ROAD
========================= */

const roadMat=
  material(0x30363b,.95);

const sidewalkMat=
  material(0xb5bdbd,.85);

const grassMat=
  material(0x66806d,1);

cube(
  15,.18,240,
  roadMat,
  0,-.12,-65
);

cube(
  4,.2,240,
  sidewalkMat,
  -9,-.06,-65
);

cube(
  4,.2,240,
  sidewalkMat,
  9,-.06,-65
);

cube(
  50,.12,240,
  grassMat,
  0,-.3,-65
);


/* =========================
   THREE LANES
========================= */

const stripeMat=
  material(0xffffff,.7);

for(
  let z=5;
  z>-180;
  z-=7
){

  cube(
    .13,
    .035,
    3.4,
    stripeMat,
    -2.5,
    .02,
    z
  );

  cube(
    .13,
    .035,
    3.4,
    stripeMat,
    2.5,
    .02,
    z
  );
}


/* =========================
   RAILWAY TRACKS
========================= */

const railMat=
  material(0x8f999b,.25,.65);

const sleeperMat=
  material(0x594233,1);

for(
  const x of [-5.7,5.7]
){

  cube(
    .12,.16,220,
    railMat,
    x,.05,-70
  );

  cube(
    .12,.16,220,
    railMat,
    x+(x<0?.75:-.75),
    .05,
    -70
  );

  for(
    let z=4;
    z>-180;
    z-=4
  ){

    cube(
      1.8,.12,.32,
      sleeperMat,
      x+(x<0?.38:-.38),
      -.01,
      z
    );
  }
}


/* =========================
   CITY BUILDINGS
========================= */

function createBuilding(
  side,
  z
){

  const width=
    5+Math.random()*6;

  const height=
    8+Math.random()*14;

  const x=
    side*(12+Math.random()*5);

  const building=
    cube(
      width,
      height,
      11,
      material(
        new THREE.Color().setHSL(
          .53+Math.random()*.06,
          .22,
          .35+Math.random()*.13
        ),
        .9
      ),
      x,
      height/2,
      z
    );

  building.userData.city=true;

  const windowMat=
    material(0xbce8ed,.35);

  for(
    let row=0;
    row<Math.floor(height/3);
    row++
  ){

    for(
      let col=0;
      col<Math.max(2,Math.floor(width/2));
      col++
    ){

      const wx=
        x-width/2+
        1+
        col*(width-2)/(Math.max(1,
          Math.floor(width/2)-1));

      const win=
        cube(
          .55,
          .85,
          .08,
          windowMat,
          wx,
          1+row*2.6,
          z-5.55
        );

      win.userData.city=true;
    }
  }
}

for(
  let z=0;
  z>-180;
  z-=14
){

  createBuilding(-1,z);
  createBuilding(1,z-6);

}


/* =========================
   STREET LIGHTS
========================= */

function createLamp(
  side,
  z
){

  const x=side*8.6;

  cube(
    .12,5,.12,
    material(0x303b40,.5,.5),
    x,
    2.5,
    z
  );

  cube(
    1.35,.12,.12,
    material(0x303b40,.5,.5),
    x-side*.65,
    5,
    z
  );

  const bulb=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .24,16,12
      ),
      new THREE.MeshStandardMaterial({
        color:0xffefad,
        emissive:0xffc34d,
        emissiveIntensity:2
      })
    );

  bulb.position.set(
    x-side*1.25,
    4.85,
    z
  );

  bulb.userData.city=true;

  scene.add(bulb);
}

for(
  let z=-4;
  z>-170;
  z-=18
){

  createLamp(-1,z);
  createLamp(1,z-8);

}


/* =========================
   CHARACTERS
========================= */

const characterList=[

 {
  id:"hero",
  name:"Street Hero",
  price:0,
  skin:0xd59a78,
  hair:0x251c18,
  shirt:0xe64242,
  pants:0x202933
 },

 {
  id:"blue",
  name:"Blue Runner",
  price:450,
  skin:0xc88968,
  hair:0x20262a,
  shirt:0x138dca,
  pants:0x27323b
 },

 {
  id:"gold",
  name:"Golden Runner",
  price:1000,
  skin:0xdfa681,
  hair:0x3a2419,
  shirt:0xf0a62c,
  pants:0x29323b
 },

 {
  id:"night",
  name:"Night Runner",
  price:1500,
  skin:0x9d684f,
  hair:0x111419,
  shirt:0x7149d8,
  pants:0x181d29
 }

];

let wallet=
 Number(localStorage.getItem(
  "runnerCoins"
 )) || 450;

let owned=
 JSON.parse(
  localStorage.getItem(
   "runnerOwned"
  ) ||
  '["hero"]'
 );

let selected=
 localStorage.getItem(
  "runnerSelected"
 ) || "hero";


function saveData(){

 localStorage.setItem(
  "runnerCoins",
  wallet
 );

 localStorage.setItem(
  "runnerOwned",
  JSON.stringify(owned)
 );

 localStorage.setItem(
  "runnerSelected",
  selected
 );

 updateCoins();
}


function updateCoins(){

 document.getElementById(
  "coins"
 ).textContent=wallet+collectedCoins;

 document.getElementById(
  "homeCoins"
 ).textContent=wallet;

 document.getElementById(
  "storeCoins"
 ).textContent=wallet;
}


/* =========================
   CHARACTER MODEL
========================= */

function createCharacter(data){

 const g=
  new THREE.Group();

 const skin=
  material(data.skin,.7);

 const shirt=
  material(data.shirt,.8);

 const pants=
  material(data.pants,.8);

 const hair=
  material(data.hair,.8);

 const shoe=
  material(0xf1f1ee,.55);


 /* BODY */

 const torso=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .48,.85,6,14
   ),
   shirt
  );

 torso.position.y=1.45;
 torso.scale.z=.65;
 torso.castShadow=true;

 g.add(torso);


 /* HEAD */

 const head=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .54,24,18
   ),
   skin
  );

 head.position.y=2.55;
 head.castShadow=true;

 g.add(head);


 /* HAIR */

 const cap=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .57,24,14,
    0,Math.PI*2,
    0,Math.PI*.52
   ),
   hair
  );

 cap.position.y=2.63;

 g.add(cap);


 /* FACE */

 const eyeMat=
  material(0x182027,.4);

 [-.19,.19].forEach(x=>{

  const eye=
   new THREE.Mesh(
    new THREE.SphereGeometry(
     .075,12,8
    ),
    eyeMat
   );

  eye.position.set(
   x,
   2.58,
   .49
  );

  g.add(eye);
 });


 const mouth=
  new THREE.Mesh(
   new THREE.TorusGeometry(
    .14,.025,8,18,Math.PI
   ),
   material(0x8c3b40,.5)
  );

 mouth.position.set(
  0,
  2.34,
  .50
 );

 mouth.rotation.x=Math.PI;

 g.add(mouth);


 /* ARMS */

 function limb(
  x,y,z,
  radius,length,
  mat
 ){

  const m=
   new THREE.Mesh(
    new THREE.CapsuleGeometry(
     radius,
     length/2,
     6,
     10
    ),
    mat
   );

  m.position.set(x,y,z);
  m.castShadow=true;

  g.add(m);

  return m;
 }

 const leftArm=
  limb(-.62,1.43,0,.13,.8,skin);

 const rightArm=
  limb(.62,1.43,0,.13,.8,skin);

 const leftLeg=
  limb(-.25,.55,0,.17,1,pants);

 const rightLeg=
  limb(.25,.55,0,.17,1,pants);

 const leftShoe=
  limb(-.25,.05,.13,.18,.5,shoe);

 const rightShoe=
  limb(.25,.05,.13,.18,.5,shoe);

 g.userData.parts={
  leftArm,
  rightArm,
  leftLeg,
  rightLeg,
  leftShoe,
  rightShoe
 };

 return g;
}


let player=
 createCharacter(
  characterList.find(
   c=>c.id===selected
  )
);

player.position.set(
  0,
  0,
  4.5
);

scene.add(player);


/* =========================
   GAME OBJECTS
========================= */

let objects=[];

function removeObject(obj){

 scene.remove(obj.mesh);

 const i=
  objects.indexOf(obj);

 if(i>=0)
  objects.splice(i,1);
}


/* =========================
   TRAIN
========================= */

function createTrain(
 lane,
 z
){

 const g=
  new THREE.Group();

 const bodyMat=
  material(0x1682ad,.42,.15);

 const dark=
  material(0x173a48,.25,.5);

 const glass=
  material(0x9be3ee,.12,.15);

 const light=
  new THREE.MeshStandardMaterial({
   color:0xffefaa,
   emissive:0xffb62b,
   emissiveIntensity:2
  });


 /* MAIN BODY */

 const body=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.7,3.6,8.8
   ),
   bodyMat
  );

 body.position.y=1.8;
 body.castShadow=true;

 g.add(body);


 /* ROOF */

 const roof=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.85,.25,8.9
   ),
   dark
  );

 roof.position.y=3.68;

 g.add(roof);


 /* FRONT */

 const front=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.45,1.55,.18
   ),
   dark
  );

 front.position.set(
  0,
  2.55,
  4.48
 );

 g.add(front);


 /* WINDSCREEN */

 const windscreen=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.95,1.08,.08
   ),
   glass
  );

 windscreen.position.set(
  0,
  2.65,
  4.60
 );

 g.add(windscreen);


 /* LIGHTS */

 [-.82,.82].forEach(x=>{

  const bulb=
   new THREE.Mesh(
    new THREE.SphereGeometry(
     .18,16,12
    ),
    light
   );

  bulb.position.set(
   x,
   1.18,
   4.62
  );

  g.add(bulb);
 });


 /* SIDE WINDOWS */

 [-1,1].forEach(side=>{

  for(
   let zz=-3;
   zz<=3;
   zz+=2
  ){

   const w=
    new THREE.Mesh(
     new THREE.BoxGeometry(
      .06,1.1,1.25
     ),
     glass
    );

   w.position.set(
    side*1.37,
    2.35,
    zz
   );

   g.add(w);
  }

 });


 /* DOORS */

 const doorMat=
  material(0x173945,.35,.5);

 [-1,1].forEach(side=>{

  const door=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     .06,2.2,1
    ),
    doorMat
   );

  door.position.set(
   side*1.39,
   1,
   0
  );

  g.add(door);
 });


 /* WHEELS */

 for(
  const x of [-.95,.95]
 ){

  for(
   const zz of [-3,3]
  ){

   const wheel=
    new THREE.Mesh(
     new THREE.CylinderGeometry(
      .37,.37,.2,18
     ),
     dark
    );

   wheel.rotation.z=
    Math.PI/2;

   wheel.position.set(
    x,
    .35,
    zz
   );

   g.add(wheel);
  }
 }

 g.position.set(
  (lane-1)*2.5,
  0,
  z
 );

 scene.add(g);

 objects.push({
  type:"train",
  mesh:g,
  z:z
 });
}


/* =========================
   BARRICADE
========================= */

function createBarrier(
 lane,
 z
){

 const g=
  new THREE.Group();

 const base=
  cubeLocal(
   2.2,.65,.6,
   material(0x26383d,.8),
   0,.35,0
  );

 g.add(base);

 const board=
  cubeLocal(
   2.6,.72,.36,
   material(0xf0eee8,.7),
   0,1.05,0
  );

 g.add(board);

 const red=
  material(0xe33e3e,.7);

 for(
  let x=-.9;
  x<1;
  x+=.55
 ){

  const stripe=
   cubeLocal(
    .2,.8,.4,
    red,
    x,
    1.05,
    .03
   );

  stripe.rotation.z=-.5;

  g.add(stripe);
 }

 g.position.set(
  (lane-1)*2.5,
  0,
  z
 );

 scene.add(g);

 objects.push({
  type:"barrier",
  mesh:g,
  z:z
 });
}


function cubeLocal(
 w,h,d,
 mat,x,y,z
){

 const m=
  new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   mat
  );

 m.position.set(x,y,z);

 m.castShadow=true;

 return m;
}


/* =========================
   LOW OBSTACLE
========================= */

function createLowObstacle(
 lane,
 z
){

 const g=
  new THREE.Group();

 const m=
  material(0xe33e3e,.65);

 [-1.05,1.05].forEach(x=>{

  const post=
   cubeLocal(
    .17,2.4,.17,
    m,
    x,1.2,0
   );

  g.add(post);
 });

 const top=
  cubeLocal(
   2.35,.35,.35,
   m,
   0,2.35,0
  );

 g.add(top);

 g.position.set(
  (lane-1)*2.5,
  0,
  z
 );

 scene.add(g);

 objects.push({
  type:"low",
  mesh:g,
  z:z
 });
}


/* =========================
   COINS
========================= */

function createCoin(
 lane,
 z,
 y=1.5
){

 const coinMat=
  new THREE.MeshStandardMaterial({
   color:0xffca22,
   metalness:.65,
   roughness:.2,
   emissive:0x5a3900,
   emissiveIntensity:.12
  });

 const coin=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .38,.38,.12,24
   ),
   coinMat
  );

 coin.rotation.x=
  Math.PI/2;

 coin.position.set(
  (lane-1)*2.5,
  y,
  z
 );

 coin.castShadow=true;

 scene.add(coin);

 objects.push({
  type:"coin",
  mesh:coin,
  z:z,
  baseY:y,
  phase:Math.random()*6
 });
}


/* =========================
   GAME VARIABLES
========================= */

let running=false;
let paused=false;

let lane=1;
let targetLane=1;

let jumpPower=0;
let slideTimer=0;

let speed=.34;
let distance=0;
let score=0;
let collectedCoins=0;

let spawnTimer=0;
let clockTime=0;


/* =========================
   SPAWN
========================= */

function spawnPattern(){

 const random=
  Math.random();

 const l=
  Math.floor(Math.random()*3);

 if(random<.30){

  for(
   let i=0;
   i<7;
   i++
  ){

   createCoin(
    l,
    -65-i*3,
    1.45+
    Math.sin(i*.7)*.2
   );
  }

 }

 else if(random<.55){

  createBarrier(
   l,
   -65
  );

 }

 else if(random<.82){

  createTrain(
   l,
   -65
  );

 }

 else{

  createLowObstacle(
   l,
   -65
  );
 }
}


/* =========================
   PLAYER ANIMATION
========================= */

function animatePlayer(dt){

 lane+=
  (targetLane-lane)*
  Math.min(1,dt*10);

 player.position.x=
  (lane-1)*2.5;

 /* JUMP */

 player.position.y+=
  jumpPower*dt*60;

 if(player.position.y>0){

  jumpPower-=
   .012*dt*60;

  if(player.position.y<0){

   player.position.y=0;
   jumpPower=0;
  }
 }


 /* SLIDE */

 slideTimer=
  Math.max(
   0,
   slideTimer-dt
  );

 player.scale.y=
  slideTimer>0?.68:1;


 /* RUNNING */

 const run=
  Math.sin(
   clockTime*11
  );

 const p=
  player.userData.parts;

 p.leftLeg.rotation.x=
  run*.65;

 p.rightLeg.rotation.x=
  -run*.65;

 p.leftArm.rotation.x=
  -run*.5;

 p.rightArm.rotation.x=
  run*.5;

 p.leftShoe.rotation.x=
  run*.4;

 p.rightShoe.rotation.x=
  -run*.4;


 /* LANE LEAN */

 player.rotation.z=
  (targetLane-lane)*-.22;

 player.rotation.x=
  jumpPower>0?.12:0;
}


/* =========================
   GAME UPDATE
========================= */

function update(dt){

 clockTime+=dt;

 speed=
  Math.min(
   .62,
   speed+dt*.003
  );

 distance+=
  speed*dt*2.3;

 score=
  Math.floor(distance*4);

 animatePlayer(dt);

 spawnTimer-=dt;

 if(spawnTimer<=0){

  spawnPattern();

  spawnTimer=
   Math.max(
    .85,
    1.55-speed
   );
 }


 /* OBJECT MOVEMENT */

 for(
  let i=objects.length-1;
  i>=0;
  i--
 ){

  const o=objects[i];

  o.z+=
   speed*dt*10;

  o.mesh.position.z=
   o.z;


  /* COIN ANIMATION */

  if(o.type==="coin"){

   o.mesh.rotation.z+=
    dt*5;

   o.mesh.position.y=
    o.baseY+
    Math.sin(
     clockTime*4+
     o.phase
    )*.08;
  }


  /* REMOVE */

  if(o.z>14){

   removeObject(o);
   continue;
  }


  /* COLLISION */

  if(
   o.z>3.3 &&
   o.z<5.8 &&
   Math.abs(
    o.mesh.position.x-
    player.position.x
   )<1.05
  ){

   if(o.type==="coin"){

    collectedCoins++;

    removeObject(o);

    continue;
   }


   const jumping=
    player.position.y>.95;

   const sliding=
    slideTimer>0;


   if(
    (o.type==="barrier"&&!jumping) ||
    (o.type==="low"&&!sliding) ||
    (o.type==="train"&&!jumping)
   ){

    gameOver();
    return;
   }
  }
 }


 /* CITY MOVEMENT */

 scene.traverse(
  obj=>{

   if(obj.userData.city){

    obj.position.z+=
     speed*dt*10;

    if(
     obj.position.z>22
    ){

     obj.position.z-=195;
    }
   }
  }
 );


 /* CAMERA */

 camera.position.x+=
  (
   player.position.x*.22-
   camera.position.x
  )*
  dt*4;

 camera.position.y+=
  (
   5.2+
   player.position.y*.12-
   camera.position.y
  )*
  dt*3;

 camera.lookAt(
  player.position.x*.12,
  2,
  -16
 );


 /* HUD */

 document.getElementById(
  "score"
 ).textContent=score;

 document.getElementById(
  "coins"
 ).textContent=
  wallet+collectedCoins;

 document.getElementById(
  "distance"
 ).textContent=
  Math.floor(distance);
}


/* =========================
   GAME LOOP
========================= */

let lastTime=0;

function gameLoop(time){

 requestAnimationFrame(
  gameLoop
 );

 const dt=
  Math.min(
   .035,
   (time-lastTime)/1000
  );

 lastTime=time;

 if(
  running &&
  !paused
 ){

  update(dt);
 }

 renderer.render(
  scene,
  camera
 );
}

requestAnimationFrame(
 gameLoop
);


/* =========================
   CONTROLS
========================= */

function moveLeft(){

 if(!running||paused)return;

 targetLane=
  Math.max(
   0,
   targetLane-1
  );
}

function moveRight(){

 if(!running||paused)return;

 targetLane=
  Math.min(
   2,
   targetLane+1
  );
}

function jump(){

 if(
  !running||
  paused
 )return;

 if(
  player.position.y<=.02
 ){

  jumpPower=.27;
 }
}

function slide(){

 if(
  !running||
  paused
 )return;

 if(
  player.position.y<=.02
 ){

  slideTimer=.65;
 }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
 "keydown",
 e=>{

  if(e.key==="ArrowLeft")
   moveLeft();

  if(e.key==="ArrowRight")
   moveRight();

  if(
   e.key==="ArrowUp"||
   e.code==="Space"
  )
   jump();

  if(e.key==="ArrowDown")
   slide();

  if(
   e.key==="Escape" &&
   running
  )
   togglePause();
 }
);


/* =========================
   MOBILE SWIPE
========================= */

let startX=0;
let startY=0;

document.addEventListener(
 "touchstart",
 e=>{

  startX=
   e.touches[0].clientX;

  startY=
   e.touches[0].clientY;

 },
 {passive:true}
);

document.addEventListener(
 "touchend",
 e=>{

  const endX=
   e.changedTouches[0].clientX;

  const endY=
   e.changedTouches[0].clientY;

  const dx=endX-startX;
  const dy=endY-startY;

  if(
   Math.max(
    Math.abs(dx),
    Math.abs(dy)
   )<30
  )
   return;

  if(
   Math.abs(dx)>
   Math.abs(dy)
  ){

   dx>0?
    moveRight():
    moveLeft();

  }else{

   dy<0?
    jump():
    slide();
  }

 },
 {passive:true}
);


/* =========================
   START / END
========================= */

function startGame(){

 document.getElementById(
  "home"
 ).style.display="none";

 document.getElementById(
  "gameOver"
 ).style.display="none";

 document.getElementById(
  "pauseScreen"
 ).style.display="none";

 clearGameObjects();

 running=true;
 paused=false;

 lane=1;
 targetLane=1;

 jumpPower=0;
 slideTimer=0;

 speed=.34;

 distance=0;
 score=0;
 collectedCoins=0;

 spawnTimer=.2;

 player.position.set(
  0,
  0,
  4.5
 );

 player.rotation.set(
  0,0,0
 );

 player.scale.set(
  1,1,1
 );
}


function clearGameObjects(){

 while(
  objects.length
 ){

  scene.remove(
   objects.pop().mesh
  );
 }
}


function gameOver(){

 running=false;

 wallet+=
  collectedCoins;

 saveData();

 document.getElementById(
  "finalScore"
 ).textContent=score;

 document.getElementById(
  "finalCoins"
 ).textContent=
  collectedCoins;

 document.getElementById(
  "gameOver"
 ).style.display="flex";
}


/* =========================
   PAUSE
========================= */

document.getElementById(
 "pause"
).onclick=togglePause;


function togglePause(){

 if(!running)return;

 paused=!paused;

 document.getElementById(
  "pauseScreen"
 ).style.display=
  paused?"flex":"none";
}


function resumeGame(){

 paused=false;

 document.getElementById(
  "pauseScreen"
 ).style.display="none";
}


function goHome(){

 running=false;
 paused=false;

 document.getElementById(
  "pauseScreen"
 ).style.display="none";

 document.getElementById(
  "gameOver"
 ).style.display="none";

 document.getElementById(
  "home"
 ).style.display="flex";

 updateCoins();
}


/* =========================
   STORE
========================= */

let storeReturn="home";


function openStore(from){

 storeReturn=from;

 paused=true;

 document.getElementById(
  "home"
 ).style.display="none";

 document.getElementById(
  "pauseScreen"
 ).style.display="none";

 document.getElementById(
  "gameOver"
 ).style.display="none";

 document.getElementById(
  "store"
 ).style.display="flex";

 renderStore();
}


function closeStore(){

 document.getElementById(
  "store"
 ).style.display="none";

 if(storeReturn==="game"){

  document.getElementById(
   "pauseScreen"
  ).style.display="flex";

 }else if(storeReturn==="over"){

  document.getElementById(
   "gameOver"
  ).style.display="flex";

 }else{

  document.getElementById(
   "home"
  ).style.display="flex";
 }
}


function renderStore(){

 const container=
  document.getElementById(
   "characterCards"
  );

 container.innerHTML="";

 characterList.forEach(
  character=>{

   const card=
    document.createElement("div");

   const isOwned=
    owned.includes(
     character.id
    );

   const isSelected=
    selected===
    character.id;

   card.className=
    "card"+
    (isSelected?
     " selected":
     "");

   card.innerHTML=`

    <div class="avatar">

      <div
       class="hair"
       style="
       background:#${character.hair
        .toString(16)
        .padStart(6,"0")}
       ">
      </div>

      <div
       class="head"
       style="
       background:#${character.skin
        .toString(16)
        .padStart(6,"0")}
       ">
      </div>

      <div
       class="body"
       style="
       background:#${character.shirt
        .toString(16)
        .padStart(6,"0")}
       ">
      </div>

    </div>

    <h3>
     ${character.name}
    </h3>

    <span class="price">
     ${
      isOwned?
      "OWNED":
      "🪙 "+character.price
     }
    </span>

    <button class="buy ${
     isSelected?
     "selected":
     isOwned?
     "owned":
     ""
    }">

     ${
      isSelected?
      "✓ SELECTED":
      isOwned?
      "SELECT":
      "BUY"
     }

    </button>
   `;


   card
    .querySelector(".buy")
    .onclick=()=>{

     if(!isOwned){

      if(
       wallet<
       character.price
      ){

       alert(
        "Coins kam hain!"
       );

       return;
      }

      wallet-=
       character.price;

      owned.push(
       character.id
      );
     }

     selected=
      character.id;

     saveData();

     scene.remove(
      player
     );

     player=
      createCharacter(
       character
      );

     player.position.set(
      (targetLane-1)*2.5,
      0,
      4.5
     );

     scene.add(player);

     renderStore();
    };


   container.appendChild(
    card
   );
  }
 );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);


/* =========================
   INITIAL
========================= */

function updateInitial(){

 document.getElementById(
  "homeCoins"
 ).textContent=wallet;

 document.getElementById(
  "storeCoins"
 ).textContent=wallet;

 document.getElementById(
  "coins"
 ).textContent=wallet;
}

updateInitial();

</script>

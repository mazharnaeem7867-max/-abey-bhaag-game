<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abey Bhaag!</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06111e;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#65cfff;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    gap:6px;
    pointer-events:none;
}

.hudBox{
    background:#09233bf2;
    border:3px solid white;
    border-radius:14px;
    padding:7px 10px;
    color:white;
    font-size:14px;
    font-weight:900;
    box-shadow:0 4px 10px #0008;
}

.pause{
    position:absolute;
    top:68px;
    left:10px;
    z-index:15;
    width:48px;
    height:48px;
    border:3px solid #17334c;
    border-radius:14px;
    background:white;
    font-size:21px;
}

.controls{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
    display:flex;
    gap:6px;
}

.controls button{
    width:56px;
    height:47px;
    border:3px solid white;
    border-radius:14px;
    background:#09233bcc;
    color:white;
    font-size:21px;
    font-weight:900;
}

/* HOME */

#home{
    position:absolute;
    inset:0;
    z-index:30;
    overflow:auto;
    background:linear-gradient(
        #20adf2 0%,
        #d7f7ff 44%,
        #315c72 100%
    );
}

.homeCard{
    width:min(430px,95vw);
    min-height:100%;
    margin:auto;
    padding:18px 12px 30px;
    text-align:center;
}

.logo{
    margin-top:20px;
    font-size:58px;
    line-height:.78;
    font-weight:1000;
    font-style:italic;
    letter-spacing:-5px;
    color:#ffc800;
    text-shadow:
        4px 5px #162d46,
        -2px -2px white;
}

.logo span{
    color:#06c8ff;
}

.tag{
    display:inline-block;
    margin:16px 0;
    padding:8px 14px;
    border-radius:12px;
    background:#f3af10;
    border:3px solid #714000;
    color:#172a40;
    font-size:13px;
    font-weight:900;
}

.play{
    display:block;
    width:82%;
    margin:10px auto 18px;
    padding:12px;
    border:5px solid white;
    border-radius:40px;
    background:linear-gradient(#fff02b,#ff8d00);
    color:#172a40;
    font-size:34px;
    font-weight:1000;
    box-shadow:0 7px 0 #884300;
}

.characterTitle{
    color:white;
    font-size:15px;
    font-weight:1000;
    margin-bottom:9px;
}

.characters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.character{
    border:3px solid #45677e;
    border-radius:14px;
    background:#0d2c48;
    color:white;
    padding:5px 2px;
    font-weight:900;
    cursor:pointer;
}

.character.selected{
    border-color:#62ff58;
    box-shadow:0 0 15px #62ff5888;
}

.characterImage{
    height:72px;
    border-radius:9px;
    background:linear-gradient(#8edfff,#f2fdff);
    position:relative;
    overflow:hidden;
}

.head{
    position:absolute;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#ffd0a8;
    left:50%;
    top:8px;
    transform:translateX(-50%);
}

.hair{
    position:absolute;
    width:44px;
    height:27px;
    border-radius:50% 50% 35% 35%;
    background:#91502d;
    left:50%;
    top:4px;
    transform:translateX(-50%);
}

.body{
    position:absolute;
    width:45px;
    height:38px;
    border-radius:18px 18px 5px 5px;
    background:#172839;
    left:50%;
    bottom:-5px;
    transform:translateX(-50%);
}

.character.blue .body{
    background:#149fe1;
}

.character.red .body{
    background:#df3c3c;
}

.character.cat .head{
    background:white;
}

.character.cat .hair{
    background:#6b9abc;
}

.character small{
    color:#ffd21a;
    font-size:9px;
}

.homeInfo{
    margin-top:15px;
    padding:11px;
    border:2px solid #3cc0ff;
    border-radius:14px;
    background:#09233bea;
    color:white;
    font-size:12px;
    font-weight:900;
}

/* GAME OVER */

#gameOver{
    position:absolute;
    inset:0;
    z-index:40;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#000b;
}

.overCard{
    width:min(390px,92vw);
    padding:23px;
    border-radius:24px;
    background:#092641;
    border:4px solid #3bc5ff;
    color:white;
    text-align:center;
}

.overCard h2{
    color:#ffd21a;
    font-size:38px;
    margin-bottom:8px;
}

.restart{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:4px solid white;
    border-radius:17px;
    background:linear-gradient(#fff02b,#ff9000);
    color:#17283a;
    font-size:22px;
    font-weight:1000;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">
    <div class="hudBox">⭐ <span id="score">00000</span></div>
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">🏃 <span id="distance">0</span>m</div>
</div>

<button class="pause" onclick="togglePause()">⏸</button>

<div class="controls">
    <button onclick="moveLane(-1)">◀</button>
    <button onclick="jump()">⬆</button>
    <button onclick="slide()">⬇</button>
    <button onclick="moveLane(1)">▶</button>
</div>

<!-- HOME -->

<div id="home">

<div class="homeCard">

<div class="logo">
    ABEY<br>
    <span>BHAAG!</span>
</div>

<div class="tag">
    Pakray gaye to Game Over! 🎮
</div>

<button class="play" onclick="startGame()">
    ▶ PLAY
</button>

<div class="characterTitle">
    SELECT CHARACTER
</div>

<div class="characters" id="characters"></div>

<div class="homeInfo">
    🛣️ Endless Runner &nbsp; • &nbsp;
    🚂 Trains &nbsp; • &nbsp;
    🪙 Coins
</div>

</div>

</div>

<!-- GAME OVER -->

<div id="gameOver">

<div class="overCard">

<h2>GAME OVER!</h2>

<p>Obstacle se takra gaye 😱</p>

<p style="margin-top:10px;">
⭐ Score: <b id="finalScore">0</b>
</p>

<p style="margin-top:5px;">
🪙 Coins: <b id="finalCoins">0</b>
</p>

<button class="restart" onclick="startGame()">
    🔄 RUN AGAIN
</button>

</div>

</div>

</div>

<script>

/* =========================
   BASIC GAME SETUP
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = canvas.clientWidth;
    H = canvas.clientHeight;

    DPR = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================
   CHARACTERS
========================= */

const characterList = [
    {
        name:"Adrien",
        price:"FREE",
        cls:""
    },
    {
        name:"MrBeast",
        price:"🪙 1000",
        cls:"blue"
    },
    {
        name:"Doraemon",
        price:"🪙 500",
        cls:"cat"
    },
    {
        name:"Ronaldo",
        price:"🪙 2000",
        cls:"red"
    }
];

let selectedCharacter = "Adrien";

function renderCharacters(){

    const container =
        document.getElementById("characters");

    container.innerHTML = "";

    characterList.forEach(character => {

        const button =
            document.createElement("button");

        button.className =
            "character " +
            character.cls +
            (selectedCharacter === character.name
                ? " selected"
                : "");

        button.innerHTML = `
            <div class="characterImage">
                <i class="head"></i>
                <i class="hair"></i>
                <i class="body"></i>
            </div>

            <div>${character.name}</div>

            <small>${character.price}</small>
        `;

        button.onclick = () => {

            selectedCharacter =
                character.name;

            renderCharacters();
        };

        container.appendChild(button);

    });
}

renderCharacters();


/* =========================
   GAME VARIABLES
========================= */

let running = false;
let paused = false;

let lastTime = 0;
let animationFrame = 0;

let score = 0;
let coins = 0;
let distance = 0;

let speed = 0.008;

let worldOffset = 0;

let spawnTimer = 0;

let objects = [];

let currentLane = 1;
let targetLane = 1;

let action = "";
let actionEnd = 0;


/* =========================
   START GAME
========================= */

function startGame(){

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("gameOver")
        .style.display = "none";

    running = true;
    paused = false;

    score = 0;
    coins = 0;
    distance = 0;

    speed = 0.008;
    worldOffset = 0;

    spawnTimer = 0;

    objects = [];

    currentLane = 1;
    targetLane = 1;

    action = "";

    lastTime = performance.now();

    cancelAnimationFrame(animationFrame);

    animationFrame =
        requestAnimationFrame(gameLoop);
}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!running) return;

    paused = !paused;

    if(!paused){

        lastTime = performance.now();

        animationFrame =
            requestAnimationFrame(gameLoop);
    }
}


/* =========================
   CONTROLS
========================= */

function moveLane(direction){

    if(!running || paused) return;

    targetLane += direction;

    if(targetLane < 0)
        targetLane = 0;

    if(targetLane > 2)
        targetLane = 2;
}


function jump(){

    if(!running || paused) return;

    if(action !== "") return;

    action = "jump";

    actionEnd =
        performance.now() + 650;
}


function slide(){

    if(!running || paused) return;

    if(action !== "") return;

    action = "slide";

    actionEnd =
        performance.now() + 650;
}


/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",event=>{

    if(event.key === "ArrowLeft")
        moveLane(-1);

    if(event.key === "ArrowRight")
        moveLane(1);

    if(event.key === "ArrowUp")
        jump();

    if(event.key === "ArrowDown")
        slide();

});


/* =========================
   MOBILE SWIPE
========================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {passive:true}
);


canvas.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX - touchStartX;

        const dy =
            touch.clientY - touchStartY;

        if(Math.max(
            Math.abs(dx),
            Math.abs(dy)
        ) < 25) return;

        if(Math.abs(dx) >
           Math.abs(dy)){

            moveLane(dx > 0 ? 1 : -1);

        }else{

            if(dy < 0)
                jump();
            else
                slide();
        }

    },
    {passive:true}
);


/* =========================
   GAME LOOP
========================= */

function gameLoop(now){

    if(!running) return;

    const delta =
        Math.min(
            2,
            (now-lastTime)/16.67
        );

    lastTime = now;

    if(!paused){

        update(delta,now);
    }

    draw();

    animationFrame =
        requestAnimationFrame(gameLoop);
}


/* =========================
   UPDATE
========================= */

function update(delta,now){

    /* CONTINUOUS WORLD MOVEMENT */

    worldOffset +=
        speed * delta * 100;

    speed =
        Math.min(
            0.019,
            speed + 0.000002 * delta
        );


    /* CHARACTER LANE SMOOTH MOVEMENT */

    currentLane +=
        (targetLane-currentLane)
        * 0.18
        * delta;


    /* ACTION TIMER */

    if(action &&
       now > actionEnd){

        action = "";
    }


    /* SCORE */

    score +=
        Math.floor(1.5 * delta);

    distance +=
        Math.floor(
            speed * 12 * delta
        );


    /* SPAWN */

    spawnTimer -= delta;

    if(spawnTimer <= 0){

        spawnObject();

        spawnTimer =
            42 + Math.random()*30;
    }


    /* MOVE OBJECTS TOWARD PLAYER */

    objects.forEach(object => {

        object.z +=
            speed * delta;

    });


    /* COLLISIONS */

    for(let i=objects.length-1;i>=0;i--){

        const object =
            objects[i];

        if(
            object.z > 0.82 &&
            object.z < 1.02 &&
            Math.abs(
                object.lane-currentLane
            ) < 0.32 &&
            !object.hit
        ){

            object.hit = true;


            /* COIN */

            if(object.type === "coin"){

                coins++;

                objects.splice(i,1);

                continue;
            }


            /* JUMP OVER BARRIER */

            const safeBarrier =
                object.type === "barrier" &&
                action === "jump";


            /* SLIDE UNDER TRAIN */

            const safeTrain =
                object.type === "train" &&
                action === "slide";


            if(!safeBarrier &&
               !safeTrain){

                gameOver();

                return;
            }
        }


        if(object.z > 1.12){

            objects.splice(i,1);
        }

    }


    document.getElementById("score")
        .textContent =
        String(score).padStart(5,"0");

    document.getElementById("coins")
        .textContent = coins;

    document.getElementById("distance")
        .textContent = distance;
}


/* =========================
   SPAWN OBJECTS
========================= */

function spawnObject(){

    const lane =
        Math.floor(
            Math.random()*3
        );

    const random =
        Math.random();

    let type;


    if(random < 0.45){

        type = "coin";

    }else if(random < 0.68){

        type = "barrier";

    }else{

        type = "train";
    }


    objects.push({

        type:type,

        lane:lane,

        z:-0.08,

        hit:false
    });


    /* EXTRA COIN PATH */

    if(type === "barrier"){

        objects.push({

            type:"coin",

            lane:
                (lane+1)%3,

            z:-0.28,

            hit:false
        });
    }


    if(type === "train"){

        objects.push({

            type:"coin",

            lane:
                (lane+2)%3,

            z:-0.25,

            hit:false
        });
    }
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running = false;

    cancelAnimationFrame(
        animationFrame
    );

    document.getElementById(
        "finalScore"
    ).textContent = score;

    document.getElementById(
        "finalCoins"
    ).textContent = coins;

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}


/* =========================
   ROAD PROJECTION
========================= */

function roadY(z){

    return (
        H*0.40 +
        (H*0.92-H*0.40)*z
    );
}


function roadHalf(z){

    return (
        W*0.16 +
        (W*0.70-W*0.16)*z
    );
}


function laneX(lane,z){

    return (
        W/2 +
        (lane-1) *
        roadHalf(z) *
        0.62
    );
}


/* =========================
   DRAW EVERYTHING
========================= */

function draw(){

    ctx.clearRect(
        0,0,W,H
    );

    drawSky();

    drawBuildings();

    drawRoad();

    drawSideDetails();

    drawObjects();

    drawPlayer();

    drawCrowd();
}


/* =========================
   SKY
========================= */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,0,0,H*.5
        );

    gradient.addColorStop(
        0,
        "#19aaf0"
    );

    gradient.addColorStop(
        1,
        "#d9f8ff"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,0,W,H*.55
    );


    ctx.fillStyle =
        "#ffe36a";

    ctx.beginPath();

    ctx.arc(
        W*.82,
        H*.10,
        27,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
   MOVING CITY
========================= */

function drawBuildings(){

    for(
        let layer=0;
        layer<2;
        layer++
    ){

        const shift =
            (
                worldOffset *
                (layer===0 ? 0.07 : 0.04)
            ) % W;

        const spacing = 78;

        for(
            let i=-2;
            i<10;
            i++
        ){

            const x =
                i*spacing-shift;

            const height =
                55 +
                (
                    (
                        i*43
                    )%105+105
                )%105 *
                (layer ? .6 : 1);

            const base =
                H*.43 -
                layer*18;


            ctx.fillStyle =
                layer
                ? "#547b90"
                : "#719dad";

            ctx.fillRect(
                x,
                base-height,
                spacing-8,
                height
            );


            ctx.fillStyle =
                "#d8f1f8";


            for(
                let row=0;
                row<4;
                row++
            ){

                for(
                    let col=0;
                    col<2;
                    col++
                ){

                    ctx.fillRect(
                        x+13+col*25,
                        base-height+13+row*23,
                        9,
                        7
                    );

                }
            }

        }

    }

}


/* =========================
   ROAD
========================= */

function drawRoad(){

    const horizon =
        H*.40;


    /* LEFT SIDE */

    ctx.fillStyle =
        "#a6a39d";

    ctx.beginPath();

    ctx.moveTo(
        0,horizon
    );

    ctx.lineTo(
        W*.27,horizon
    );

    ctx.lineTo(
        0,H
    );

    ctx.closePath();

    ctx.fill();


    /* RIGHT SIDE */

    ctx.beginPath();

    ctx.moveTo(
        W,horizon
    );

    ctx.lineTo(
        W*.73,horizon
    );

    ctx.lineTo(
        W,H
    );

    ctx.closePath();

    ctx.fill();


    /* ROAD */

    ctx.fillStyle =
        "#41484e";

    ctx.beginPath();

    ctx.moveTo(
        W*.27,
        horizon
    );

    ctx.lineTo(
        W*.73,
        horizon
    );

    ctx.lineTo(
        W*1.05,
        H
    );

    ctx.lineTo(
        -W*.05,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* LANE MARKINGS */

    for(
        const laneDivider of [
            -.16,
            .16
        ]
    ){

        for(
            let i=0;
            i<13;
            i++
        ){

            const z =
                (
                    i*.105 +
                    worldOffset*.002
                ) % 1;

            const y =
                roadY(z);

            const x =
                W/2 +
                laneDivider *
                2 *
                roadHalf(z);


            ctx.fillStyle =
                "#ffffff";

            ctx.fillRect(
                x-2,
                y,
                4,
                8+z*25
            );

        }

    }

}


/* =========================
   MOVING SIDE CURBS
========================= */

function drawSideDetails(){

    const horizon =
        H*.40;

    const offset =
        (
            worldOffset*.30
        ) % 45;


    for(
        let i=-1;
        i<22;
        i++
    ){

        const y =
            horizon +
            i *
            (H-horizon)/18 +
            offset;

        if(y > H)
            continue;


        const z =
            Math.max(
                0,
                Math.min(
                    1,
                    (y-horizon)/
                    (H-horizon)
                )
            );


        const width =
            18+z*20;


        ctx.fillStyle =
            i%2
            ? "#f1f1f1"
            : "#e53c37";


        ctx.fillRect(
            2,
            y,
            width,
            10+z*5
        );


        ctx.fillRect(
            W-width-2,
            y,
            width,
            10+z*5
        );

    }


    /* MOVING TREES */

    const treeOffset =
        (worldOffset*.16)%110;


    for(
        let i=-2;
        i<8;
        i++
    ){

        const y =
            H*.40 +
            i*85 +
            treeOffset;

        if(y>H*.85)
            continue;

        drawTree(
            30,
            y,
            .6
        );

        drawTree(
            W-30,
            y+25,
            .6
        );
    }

}


/* =========================
   TREE
========================= */

function drawTree(x,y,scale){

    ctx.save();

    ctx.translate(
        x,y
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.fillStyle =
        "#704a2e";

    ctx.fillRect(
        -4,
        0,
        8,
        38
    );


    ctx.fillStyle =
        "#2f914c";


    for(
        let i=0;
        i<3;
        i++
    ){

        ctx.beginPath();

        ctx.arc(
            (i-1)*15,
            -10-i*9,
            23,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================
   OBJECTS
========================= */

function drawObjects(){

    objects
        .slice()
        .sort(
            (a,b)=>a.z-b.z
        )
        .forEach(object=>{

            const z =
                Math.max(
                    0,
                    Math.min(
                        1,
                        object.z
                    )
                );

            const scale =
                .32 +
                z*1.18;

            const x =
                laneX(
                    object.lane,
                    z
                );

            const y =
                roadY(z);


            ctx.save();

            ctx.translate(
                x,
                y
            );

            ctx.scale(
                scale,
                scale
            );


            if(object.type === "coin")
                drawCoin();

            else if(object.type === "barrier")
                drawBarrier();

            else
                drawTrain();


            ctx.restore();

        });

}


/* =========================
   COIN
========================= */

function drawCoin(){

    ctx.fillStyle =
        "#ffd21a";

    ctx.strokeStyle =
        "#fff1a0";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.ellipse(
        0,
        -8,
        19,
        26,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
    ctx.stroke();


    ctx.fillStyle =
        "#9c6000";

    ctx.font =
        "bold 20px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "★",
        0,
        -1
    );

}


/* =========================
   BARRIER
========================= */

function drawBarrier(){

    ctx.fillStyle =
        "#eeeeee";

    ctx.fillRect(
        -34,
        -32,
        68,
        48
    );


    ctx.fillStyle =
        "#e53d37";


    for(
        let x=-34;
        x<40;
        x+=22
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            -32
        );

        ctx.lineTo(
            x+15,
            -32
        );

        ctx.lineTo(
            x-4,
            16
        );

        ctx.lineTo(
            x-19,
            16
        );

        ctx.closePath();

        ctx.fill();
    }


    ctx.strokeStyle =
        "#263848";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        -34,
        -32,
        68,
        48
    );

}


/* =========================
   TRAIN
========================= */

function drawTrain(){

    /* LARGE SUBWAY-STYLE TRAIN */

    ctx.fillStyle =
        "#1581c3";

    ctx.fillRect(
        -35,
        -82,
        70,
        112
    );


    ctx.fillStyle =
        "#0e2a40";

    ctx.fillRect(
        -27,
        -66,
        54,
        35
    );


    ctx.fillStyle =
        "#c9edf8";

    ctx.fillRect(
        -21,
        -61,
        16,
        19
    );

    ctx.fillRect(
        5,
        -61,
        16,
        19
    );


    ctx.fillStyle =
        "#ffd21a";

    ctx.beginPath();

    ctx.arc(
        0,
        12,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#102b41";

    ctx.fillRect(
        -35,
        22,
        70,
        8
    );


    ctx.strokeStyle =
        "#0b3048";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        -35,
        -82,
        70,
        112
    );

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

    const x =
        laneX(
            currentLane,
            .90
        );

    let y =
        H*.79;


    if(action === "jump")
        y -= 85;

    if(action === "slide")
        y += 25;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /* SHADOW */

    ctx.fillStyle =
        "#0007";

    ctx.beginPath();

    ctx.ellipse(
        0,
        55,
        40,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* LEGS */

    ctx.strokeStyle =
        "#172737";

    ctx.lineWidth = 14;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        -9,
        13
    );

    ctx.lineTo(
        -25,
        46
    );

    ctx.moveTo(
        9,
        13
    );

    ctx.lineTo(
        26,
        45
    );

    ctx.stroke();


    /* SHOES */

    ctx.strokeStyle =
        "#f5f5f5";

    ctx.lineWidth = 9;

    ctx.beginPath();

    ctx.moveTo(
        -25,
        46
    );

    ctx.lineTo(
        -7,
        46
    );

    ctx.moveTo(
        26,
        45
    );

    ctx.lineTo(
        43,
        45
    );

    ctx.stroke();


    /* BODY */

    ctx.fillStyle =
        selectedCharacter === "Doraemon"
        ? "#198fd0"
        : "#172a3d";

    ctx.beginPath();

    ctx.roundRect(
        -28,
        -30,
        56,
        58,
        18
    );

    ctx.fill();


    /* HEAD */

    ctx.fillStyle =
        "#ffd0a8";

    ctx.beginPath();

    ctx.arc(
        0,
        -52,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* HAIR */

    ctx.fillStyle =
        selectedCharacter === "Ronaldo"
        ? "#2c3038"
        : selectedCharacter === "MrBeast"
        ? "#563722"
        : selectedCharacter === "Doraemon"
        ? "#6b9abd"
        : "#92502d";

    ctx.beginPath();

    ctx.arc(
        0,
        -62,
        27,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* ARMS */

    ctx.strokeStyle =
        "#ffd0a8";

    ctx.lineWidth = 12;

    ctx.beginPath();

    ctx.moveTo(
        -22,
        -14
    );

    ctx.lineTo(
        -43,
        7
    );

    ctx.moveTo(
        22,
        -14
    );

    ctx.lineTo(
        41,
        -29
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================
   CROWD
========================= */

function drawCrowd(){

    for(
        let i=0;
        i<11;
        i++
    ){

        const x =
            i*(W/10) +
            Math.sin(
                worldOffset*.01+i
            )*4;

        const y =
            H*.96;


        /* BODY */

        ctx.fillStyle =
            i%2
            ? "#161e27"
            : "#28343e";

        ctx.fillRect(
            x-22,
            y-7,
            44,
            32
        );


        /* HEAD */

        ctx.fillStyle =
            "#ffd0a8";

        ctx.beginPath();

        ctx.arc(
            x,
            y-35,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================
   INITIAL DRAW
========================= */

draw();

</script>

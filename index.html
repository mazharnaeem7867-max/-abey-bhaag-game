<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abey Bhaag!</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79d8f5;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:20;
  display:flex;
  justify-content:space-between;
}

.hudBox{
  padding:7px 10px;
  background:#112d3c;
  border:3px solid white;
  border-radius:13px;
  color:white;
  font-weight:900;
  box-shadow:0 4px 8px #0005;
}

.pause{
  position:absolute;
  top:62px;
  left:10px;
  z-index:21;
  width:48px;
  height:45px;
  border:3px solid white;
  border-radius:13px;
  background:#112d3c;
  color:white;
  font-size:19px;
  font-weight:bold;
}

.controls{
  position:absolute;
  z-index:21;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
}

.controls button{
  width:54px;
  height:46px;
  border:3px solid white;
  border-radius:13px;
  background:#112d3c;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.screen{
  position:absolute;
  inset:0;
  z-index:40;
}

/* HOME */

#home{
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(
      #45c7ec 0%,
      #dff8fc 54%,
      #65757a 55%,
      #3d4d53 100%
    );
}

.homeBox{
  width:min(430px,94vw);
  text-align:center;
}

.logo{
  font-size:54px;
  line-height:.82;
  font-weight:1000;
  font-style:italic;
  color:#ffd72b;
  text-shadow:
    4px 5px #173241,
    -2px -2px white;
}

.logo span{
  color:#08bce9;
}

.tag{
  display:inline-block;
  margin:18px 0 9px;
  padding:8px 13px;
  border:3px solid #684300;
  border-radius:12px;
  background:#ffc82b;
  color:#172e3b;
  font-weight:1000;
}

.wallet{
  display:inline-block;
  padding:7px 18px;
  border:3px solid white;
  border-radius:20px;
  background:#112d3c;
  color:#ffd32b;
  font-weight:1000;
}

.play{
  display:block;
  width:86%;
  margin:12px auto 8px;
  padding:12px;
  border:5px solid white;
  border-radius:30px;
  background:linear-gradient(#fff22d,#ff9000);
  box-shadow:0 6px #704300;
  color:#172e3b;
  font-size:29px;
  font-weight:1000;
}

.storeHome{
  display:block;
  width:86%;
  margin:auto;
  padding:11px;
  border:4px solid white;
  border-radius:25px;
  background:#112d3c;
  color:white;
  font-size:18px;
  font-weight:1000;
}

/* STORE */

#store{
  display:none;
  overflow:auto;
  background:linear-gradient(#55ccef,#e7faff 55%,#64777c);
}

.storeHead{
  width:min(480px,94vw);
  margin:auto;
  padding:13px 4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.storeHead h1{
  color:white;
  font-size:23px;
  text-shadow:2px 3px #203541;
}

.back{
  padding:8px 11px;
  border:3px solid white;
  border-radius:12px;
  background:#112d3c;
  color:white;
  font-weight:1000;
}

.storeWallet{
  text-align:center;
  color:#ffc929;
  font-size:21px;
  font-weight:1000;
  margin-bottom:10px;
}

.grid{
  width:min(480px,94vw);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding-bottom:25px;
}

.card{
  padding:8px;
  background:#112d3ced;
  border:3px solid #72d9ef;
  border-radius:18px;
  color:white;
  text-align:center;
}

.card.selected{
  border-color:#61e653;
  box-shadow:0 0 15px #61e65388;
}

.preview{
  height:145px;
  position:relative;
  overflow:hidden;
  border-radius:13px;
  background:linear-gradient(#d7f7ff,#fff);
}

.mhead{
  position:absolute;
  width:52px;
  height:52px;
  left:50%;
  top:28px;
  transform:translateX(-50%);
  border-radius:50%;
  border:3px solid #754938;
}

.mhair{
  position:absolute;
  width:62px;
  height:38px;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  border-radius:50%;
}

.mbody{
  position:absolute;
  width:70px;
  height:68px;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  border-radius:20px 20px 9px 9px;
}

.card h2{
  font-size:17px;
  margin-top:5px;
}

.price{
  margin:5px;
  color:#ffd329;
  font-weight:1000;
}

.buy{
  width:100%;
  padding:9px;
  border:0;
  border-radius:11px;
  background:linear-gradient(#ffe82c,#ff9000);
  color:#172e3b;
  font-weight:1000;
}

.buy.selected{
  background:#61df50;
}

.buy.locked{
  background:#667780;
  color:white;
}

/* PAUSE / GAME OVER */

#pauseMenu,
#gameOver{
  display:none;
  align-items:center;
  justify-content:center;
  background:#0009;
}

.menuBox{
  width:min(380px,91vw);
  padding:22px;
  background:#112d3c;
  border:4px solid #61d8f4;
  border-radius:22px;
  text-align:center;
  color:white;
}

.menuBox h1{
  color:#ffd42a;
  margin-bottom:13px;
}

.menuBtn{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:3px solid white;
  border-radius:14px;
  font-size:18px;
  font-weight:1000;
}

.resume{
  background:#5be04e;
}

.openStore{
  background:#ffc928;
}

.homeBtn{
  background:#536a74;
  color:white;
}

.restart{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:4px solid white;
  border-radius:17px;
  background:linear-gradient(#fff32b,#ff9000);
  font-size:21px;
  font-weight:1000;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">
  <div class="hudBox">⭐ <span id="score">00000</span></div>
  <div class="hudBox">🪙 <span id="coins">0</span></div>
  <div class="hudBox">📏 <span id="distance">0</span>m</div>
</div>

<button class="pause" onclick="pauseGame()">⏸</button>

<div class="controls">
  <button onclick="lane(-1)">◀</button>
  <button onclick="jump()">⬆</button>
  <button onclick="slide()">⬇</button>
  <button onclick="lane(1)">▶</button>
</div>


<!-- HOME -->

<div id="home" class="screen">

  <div class="homeBox">

    <div class="logo">
      ABEY<br>
      <span>BHAAG!</span>
    </div>

    <div class="tag">
      Pakray gaye to Game Over! 🎮
    </div>

    <br>

    <div class="wallet">
      🪙 <span id="homeCoins">450</span>
    </div>

    <button class="play" onclick="startGame()">
      ▶ PLAY
    </button>

    <button class="storeHome"
            onclick="openStore('home')">
      🏪 CHARACTER STORE
    </button>

  </div>

</div>


<!-- STORE -->

<div id="store" class="screen">

  <div class="storeHead">
    <button class="back"
            onclick="closeStore()">
      ← BACK
    </button>

    <h1>CHARACTER STORE</h1>
  </div>

  <div class="storeWallet">
    🪙 <span id="storeCoins">450</span>
  </div>

  <div class="grid" id="grid"></div>

</div>


<!-- PAUSE -->

<div id="pauseMenu" class="screen">

  <div class="menuBox">

    <h1>GAME PAUSED</h1>

    <button class="menuBtn resume"
            onclick="resumeGame()">
      ▶ RESUME
    </button>

    <button class="menuBtn openStore"
            onclick="openStore('game')">
      🏪 CHARACTER STORE
    </button>

    <button class="menuBtn homeBtn"
            onclick="goHome()">
      🏠 HOME
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen">

  <div class="menuBox">

    <h1>GAME OVER!</h1>

    <p>Obstacle se takra gaye 😱</p>

    <p style="margin-top:10px">
      ⭐ Score: <b id="finalScore">0</b>
    </p>

    <p style="margin-top:5px">
      🪙 Coins: <b id="finalCoins">0</b>
    </p>

    <button class="restart"
            onclick="startGame()">
      🔄 RUN AGAIN
    </button>

    <button class="menuBtn openStore"
            onclick="openStore('gameover')">
      🏪 STORE
    </button>

  </div>

</div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(
    devicePixelRatio||1,
    2
  );

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

addEventListener("resize",resize);
resize();


/* =========================
   CHARACTERS
========================= */

const chars=[

 {
  id:"runner",
  name:"Street Runner",
  price:0,
  skin:"#d99a78",
  hair:"#241d1a",
  shirt:"#e5363a",
  pants:"#202932",
  shoe:"#eeeeee"
 },

 {
  id:"doraemon",
  name:"Doraemon",
  price:450,
  skin:"#58b5dc",
  hair:"#58b5dc",
  shirt:"#1688c5",
  pants:"#1688c5",
  shoe:"#ffffff"
 },

 {
  id:"mrbeast",
  name:"Mr Beast",
  price:1000,
  skin:"#e8ae89",
  hair:"#422c1e",
  shirt:"#1489d1",
  pants:"#202933",
  shoe:"#eeeeee"
 },

 {
  id:"ronaldo",
  name:"Ronaldo",
  price:2000,
  skin:"#d59a76",
  hair:"#171a1d",
  shirt:"#d83232",
  pants:"#20262d",
  shoe:"#eeeeee"
 }
];


let coinsWallet=
 Number(
  localStorage.getItem("abeyCoins")
 ) || 450;

let owned=
 JSON.parse(
  localStorage.getItem("abeyOwned") ||
  '["runner"]'
 );

let selected=
 localStorage.getItem(
  "abeySelected"
 ) || "runner";


function save(){

 localStorage.setItem(
  "abeyCoins",
  coinsWallet
 );

 localStorage.setItem(
  "abeyOwned",
  JSON.stringify(owned)
 );

 localStorage.setItem(
  "abeySelected",
  selected
 );

 updateWallet();
}


function updateWallet(){

 document.getElementById(
  "homeCoins"
 ).textContent=coinsWallet;

 document.getElementById(
  "storeCoins"
 ).textContent=coinsWallet;
}

updateWallet();


/* =========================
   STORE
========================= */

let storeReturn="home";

function openStore(from){

 storeReturn=from;

 paused=true;

 home.style.display="none";
 pauseMenu.style.display="none";
 gameOver.style.display="none";

 store.style.display="block";

 renderStore();
}


function closeStore(){

 store.style.display="none";

 if(storeReturn==="game")
  pauseMenu.style.display="flex";

 else if(storeReturn==="gameover")
  gameOver.style.display="flex";

 else
  home.style.display="flex";

 updateWallet();
}


function renderStore(){

 const grid=document.getElementById("grid");

 grid.innerHTML="";

 chars.forEach(c=>{

  const isOwned=
   owned.includes(c.id);

  const isSelected=
   selected===c.id;

  const card=
   document.createElement("div");

  card.className=
   "card"+
   (isSelected?" selected":"");

  card.innerHTML=`

   <div class="preview">

    <div class="mhair"
      style="background:${c.hair}">
    </div>

    <div class="mhead"
      style="background:${c.skin}">
    </div>

    <div class="mbody"
      style="background:${c.shirt}">
    </div>

   </div>

   <h2>${c.name}</h2>

   <div class="price">
    ${isOwned?"OWNED":"🪙 "+c.price}
   </div>

   <button class="buy ${
     isSelected
      ?"selected"
      :!isOwned
      ?"locked"
      :""
   }">

    ${
     isSelected
      ?"✓ SELECTED"
      :isOwned
      ?"SELECT"
      :"🪙 BUY"
    }

   </button>
  `;

  card.querySelector(".buy")
   .onclick=()=>{

    if(!isOwned){

     if(coinsWallet<c.price){

      alert("Coins kam hain! 🪙");

      return;
     }

     coinsWallet-=c.price;

     owned.push(c.id);

     selected=c.id;

     save();

     renderStore();

     return;
    }

    selected=c.id;

    save();

    renderStore();
   };

  grid.appendChild(card);
 });
}


/* =========================
   GAME VARIABLES
========================= */

let running=false;
let paused=false;

let score=0;
let collected=0;
let distance=0;

let speed=.006;
let world=0;

let objects=[];

let spawn=20;

let playerLane=1;
let targetLane=1;

let jumpAmount=0;
let sliding=false;

let time=0;
let last=0;
let raf;


/* =========================
   START GAME
========================= */

function startGame(){

 home.style.display="none";
 store.style.display="none";
 pauseMenu.style.display="none";
 gameOver.style.display="none";

 running=true;
 paused=false;

 score=0;
 collected=0;
 distance=0;

 world=0;
 speed=.006;

 objects=[];

 spawn=25;

 playerLane=1;
 targetLane=1;

 jumpAmount=0;
 sliding=false;

 time=0;

 last=performance.now();

 cancelAnimationFrame(raf);

 raf=requestAnimationFrame(loop);
}


/* =========================
   LOOP
========================= */

function loop(now){

 if(!running)return;

 let dt=Math.min(
  2.2,
  (now-last)/16.67
 );

 last=now;

 if(!paused){

  update(dt);

  draw();

 }

 raf=requestAnimationFrame(loop);
}


/* =========================
   UPDATE
========================= */

function update(dt){

 time+=dt;

 world+=speed*dt;

 speed=Math.min(
  .0105,
  speed+.0000015*dt
 );

 playerLane +=
  (targetLane-playerLane)
  *.13*dt;


 /* jump physics */

 if(jumpAmount>0){

  jumpAmount-=
   7.2*dt;

  if(jumpAmount<0)
   jumpAmount=0;
 }


 /* running */

 score+=
  Math.floor(dt);

 distance+=
  speed*80*dt;


 /* spawn */

 spawn-=dt;

 if(spawn<=0){

  createObject();

  spawn=
   35+
   Math.random()*25-
   speed*1000;

  spawn=Math.max(
   25,
   spawn
  );
 }


 /* objects */

 for(
  let i=objects.length-1;
  i>=0;
  i--
 ){

  const o=objects[i];

  o.z+=speed*dt;

  if(
   o.z>.82 &&
   o.z<1.02 &&
   !o.hit
  ){

   if(
    o.lane===Math.round(
     playerLane
    )
   ){

    if(o.type==="coin"){

     collected++;

     objects.splice(i,1);

     continue;
    }


    let safe=false;

    if(
     o.type==="barrier" &&
     jumpAmount>35
    )
     safe=true;

    if(
     o.type==="lowbar" &&
     sliding
    )
     safe=true;

    if(
     o.type==="train" &&
     jumpAmount>65
    )
     safe=true;

    if(!safe){

     endGame();

     return;
    }
   }

   o.hit=true;
  }


  if(o.z>1.15)
   objects.splice(i,1);
 }


 document.getElementById("score")
  .textContent=
   String(score)
    .padStart(5,"0");

 document.getElementById("coins")
  .textContent=collected;

 document.getElementById("distance")
  .textContent=
   Math.floor(distance);
}


/* =========================
   OBJECT CREATION
========================= */

function createObject(){

 const lane=
  Math.floor(
   Math.random()*3
  );

 const r=Math.random();

 let type;

 if(r<.42)
  type="coin";

 else if(r<.68)
  type="barrier";

 else if(r<.87)
  type="train";

 else
  type="lowbar";


 objects.push({
  type:type,
  lane:lane,
  z:-.08,
  hit:false
 });


 /* coin line */

 if(type==="coin"){

  for(
   let i=1;
   i<5;
   i++
  ){

   objects.push({
    type:"coin",
    lane:lane,
    z:-.08-i*.065,
    hit:false
   });
  }
 }
}


/* =========================
   CONTROLS
========================= */

function lane(dir){

 if(!running||paused)return;

 targetLane+=dir;

 targetLane=
  Math.max(
   0,
   Math.min(
    2,
    targetLane
   )
  );
}


function jump(){

 if(
  !running||
  paused||
  jumpAmount>0||
  sliding
 )
  return;

 jumpAmount=105;
}


function slide(){

 if(
  !running||
  paused||
  jumpAmount>0
 )
  return;

 sliding=true;

 setTimeout(
  ()=>sliding=false,
  650
 );
}


/* =========================
   KEYBOARD
========================= */

addEventListener(
 "keydown",
 e=>{

  if(e.key==="ArrowLeft")
   lane(-1);

  if(e.key==="ArrowRight")
   lane(1);

  if(
   e.key==="ArrowUp"||
   e.key===" "
  )
   jump();

  if(e.key==="ArrowDown")
   slide();

  if(e.key==="Escape")
   pauseGame();

 }
);


/* =========================
   SWIPE
========================= */

let sx=0;
let sy=0;

canvas.addEventListener(
 "touchstart",
 e=>{

  sx=e.changedTouches[0].clientX;
  sy=e.changedTouches[0].clientY;

 },
 {passive:true}
);


canvas.addEventListener(
 "touchend",
 e=>{

  const x=
   e.changedTouches[0].clientX;

  const y=
   e.changedTouches[0].clientY;

  const dx=x-sx;
  const dy=y-sy;

  if(
   Math.max(
    Math.abs(dx),
    Math.abs(dy)
   )<25
  )
   return;

  if(
   Math.abs(dx)>
   Math.abs(dy)
  )
   lane(dx>0?1:-1);

  else if(dy<0)
   jump();

  else
   slide();

 },
 {passive:true}
);


/* =========================
   PAUSE
========================= */

function pauseGame(){

 if(!running)return;

 paused=true;

 pauseMenu.style.display="flex";
}


function resumeGame(){

 paused=false;

 pauseMenu.style.display="none";

 last=performance.now();
}


function goHome(){

 running=false;
 paused=false;

 pauseMenu.style.display="none";
 store.style.display="none";
 gameOver.style.display="none";
 home.style.display="flex";

 updateWallet();
}


/* =========================
   GAME OVER
========================= */

function endGame(){

 running=false;

 coinsWallet+=collected;

 save();

 finalScore.textContent=score;
 finalCoins.textContent=collected;

 gameOver.style.display="flex";
}


/* =========================
   PERSPECTIVE
========================= */

function roadY(z){

 return H*.40+
  (H*.99-H*.40)*z;
}


function roadWidth(z){

 return W*.10+
  (W*.86-W*.10)*z;
}


function laneX(l,z){

 return W/2+
  (l-1)*
  roadWidth(z)*.55;
}


/* =========================
   DRAW
========================= */

function draw(){

 ctx.clearRect(
  0,
  0,
  W,
  H
 );

 drawSky();
 drawCity();
 drawRoad();
 drawTracks();
 drawStreetObjects();
 drawCrowd();
 drawObjects();
 drawPlayer();
}


/* =========================
   SKY
========================= */

function drawSky(){

 const g=
  ctx.createLinearGradient(
   0,0,0,H*.48
  );

 g.addColorStop(
  0,
  "#28b9e7"
 );

 g.addColorStop(
  1,
  "#e2f8fc"
 );

 ctx.fillStyle=g;

 ctx.fillRect(
  0,0,W,H
 );


 ctx.fillStyle="#ffe477";

 ctx.beginPath();

 ctx.arc(
  W*.82,
  H*.12,
  30,
  0,
  Math.PI*2
 );

 ctx.fill();


 cloud(
  W*.16,
  H*.13,
  1
 );

 cloud(
  W*.58,
  H*.20,
  .7
 );
}


function cloud(x,y,s){

 ctx.fillStyle="#fff";

 ctx.beginPath();

 ctx.arc(
  x,y,
  17*s,
  0,
  Math.PI*2
 );

 ctx.arc(
  x+23*s,
  y-8*s,
  23*s,
  0,
  Math.PI*2
 );

 ctx.arc(
  x+48*s,
  y,
  17*s,
  0,
  Math.PI*2
 );

 ctx.fill();
}


/* =========================
   CITY
========================= */

function drawCity(){

 const horizon=H*.40;

 /*
   Far buildings
 */

 const offset=
  (world*10)%100;

 for(
  let i=-3;
  i<14;
  i++
 ){

  const x=
   i*82-offset;

  const h=
   90+
   ((i*47)%110+110)%110;

  ctx.fillStyle=
   i%2
    ?" #76939d"
    :"#607f8b";

  ctx.fillRect(
   x,
   horizon-h,
   74,
   h
  );


  ctx.fillStyle="#496673";

  ctx.fillRect(
   x-3,

/* =========================
   ROAD
========================= */

function drawRoad(){

 const horizon=H*.40;

 /*
   grass
 */

 ctx.fillStyle="#77958c";

 ctx.fillRect(
  0,
  horizon,
  W,
  H-horizon
 );


 /*
   sidewalks
 */

 ctx.fillStyle="#c7ccca";

 ctx.beginPath();

 ctx.moveTo(
  W*.19,
  horizon
 );

 ctx.lineTo(
  W*.81,
  horizon
 );

 ctx.lineTo(
  W*1.08,
  H
 );

 ctx.lineTo(
  -W*.08,
  H
 );

 ctx.closePath();

 ctx.fill();


 /*
   road
 */

 ctx.fillStyle="#343a3e";

 ctx.beginPath();

 ctx.moveTo(
  W*.29,
  horizon
 );

 ctx.lineTo(
  W*.71,
  horizon
 );

 ctx.lineTo(
  W*1.08,
  H
 );

 ctx.lineTo(
  -W*.08,
  H
 );

 ctx.closePath();

 ctx.fill();


 /*
   road center lane markings
 */

 for(
  const side of [-1,1]
 ){

  for(
   let i=0;
   i<20;
   i++
  ){

   const z=
    (i*.075+
     world*.022)%1;

   const y=roadY(z);

   const x=
    W/2+
    side*
    roadWidth(z)*.30;

   const ww=
    2.5+
    z*5;

   const hh=
    6+
    z*29;

   ctx.fillStyle="#f1f1ed";

   ctx.fillRect(
    x-ww/2,
    y,
    ww,
    hh
   );
  }
 }


 /*
   road edge
 */

 ctx.strokeStyle="#ffffff";

 ctx.lineWidth=4;

 ctx.beginPath();

 ctx.moveTo(
  W*.29,
  horizon
 );

 ctx.lineTo(
  -W*.08,
  H
 );

 ctx.moveTo(
  W*.71,
  horizon
 );

 ctx.lineTo(
  W*1.08,
  H
 );

 ctx.stroke();
}

/* =========================
   STREET OBJECTS
========================= */

function drawStreetObjects(){

 const offset=
  (world*18)%120;

 for(
  let i=-2;
  i<10;
  i++
 ){

  const y=
   H*.43+
   i*120+
   offset;

  if(y<H*.44||y>H)return;

  const z=
   Math.min(
    1,
    Math.max(
     .1,
     (y-H*.43)/(H*.57)
    )
   );

  /*
    left/right bollards
  */

  streetLamp(
   17,
   y,
   .35+z*.7
  );

  streetLamp(
   W-17,
   y+35,
   .35+z*.7
  );
 }
}


function streetLamp(x,y,s){

/* =========================
   OBJECTS
========================= */

function drawObjects(){

 objects
  .slice()
  .sort(
   (a,b)=>a.z-b.z
  )
  .forEach(o=>{

   const z=
    Math.max(
     0,
     Math.min(
      1,
      o.z
     )
    );

   const x=
    laneX(
     o.lane,
     z
    );

   const y=roadY(z);

   const s=
    .20+
    z*1.30;

   ctx.save();

   ctx.translate(
    x,
    y
   );

   ctx.scale(
    s,
    s
   );

   if(o.type==="coin")
    drawCoin();

   if(o.type==="barrier")
    drawBarrier();

   if(o.type==="train")
    drawTrain();

   if(o.type==="lowbar")
    drawLowbar();

   ctx.restore();
  });
}

/* =========================

========================= */

function drawPlayer(){

  chars.find(
   x=>x.id===selected
  )||chars[0];

   Player is deliberately
   shown from BACK/SIDE,
   not looking at camera.
 */

  laneX(
   playerLane,
   .92
  );

  H*.79;

 const y=
  baseY-
  jumpAmount;


 /*
   running cycle
 */

  time*.105;

 const leg1=
  Math.sin(cycle)*20;

 const leg2=
  Math.sin(
   cycle+Math.PI
  )*20;

 const arm1=
  Math.sin(
   cycle+Math.PI
  )*13;

 );

  -8,

 );

  -15-leg1*.45,

 );

 ctx.moveTo(
  8,
  16
 );

 ctx.lineTo(
  15-leg2*.45,
  52
 );

 ctx.stroke();

 */

 ctx.moveTo(

  55

 ctx.moveTo(

 );

 /*
   BODY
 */

 ctx.fillStyle=c.shirt;

 ctx.beginPath();

 if(sliding){

   50,

  );

 );

   neck

 ctx.fillStyle=c.skin;

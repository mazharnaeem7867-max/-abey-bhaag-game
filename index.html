<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abey Bhaag!</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#61cdf5;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  gap:6px;
  pointer-events:none;
}

.hud div{
  padding:7px 11px;
  background:#09263df2;
  color:#fff;
  border:3px solid #fff;
  border-radius:14px;
  font-weight:900;
  box-shadow:0 4px 10px #0007;
}

.pause{
  position:absolute;
  top:68px;
  left:10px;
  z-index:10;
  width:48px;
  height:48px;
  border:3px solid #17344c;
  border-radius:14px;
  background:#fff;
  font-size:20px;
}

.controls{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  gap:6px;
}

.controls button{
  width:58px;
  height:48px;
  border:3px solid #fff;
  border-radius:14px;
  background:#09263dcc;
  color:white;
  font-size:22px;
  font-weight:900;
}

/* HOME */

#home{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#18a9ed,#d9f8ff 45%,#315b70);
}

.home{
  width:min(430px,95vw);
  padding:18px;
  text-align:center;
}

.logo{
  font-size:58px;
  line-height:.78;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-5px;
  color:#ffd21b;
  text-shadow:4px 5px #152c44,-2px -2px #fff;
}

.logo span{
  color:#08c8ff;
}

.tag{
  display:inline-block;
  margin:16px 0;
  padding:8px 14px;
  border:3px solid #744500;
  border-radius:12px;
  background:#f5b21a;
  color:#172a3d;
  font-weight:900;
}

.play{
  display:block;
  width:82%;
  margin:10px auto 18px;
  padding:13px;
  border:5px solid #fff;
  border-radius:40px;
  background:linear-gradient(#fff32d,#ff8b00);
  color:#17283b;
  font-size:34px;
  font-weight:1000;
  box-shadow:0 7px #884200;
}

#gameOver{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
}

.over{
  width:min(390px,92vw);
  padding:24px;
  background:#092640;
  border:4px solid #3bc5ff;
  border-radius:24px;
  color:#fff;
  text-align:center;
}

.over h2{
  color:#ffd21b;
  font-size:40px;
  margin-bottom:10px;
}

.restart{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:4px solid #fff;
  border-radius:18px;
  background:linear-gradient(#fff32d,#ff8b00);
  font-size:22px;
  font-weight:1000;
}

/* CHARACTER SELECT */

.characterTitle{
  color:#fff;
  font-weight:1000;
  margin-bottom:9px;
}

.characters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.character{
  border:3px solid #476a82;
  border-radius:13px;
  background:#0d2d49;
  color:#fff;
  padding:5px 2px;
  font-weight:900;
}

.character.selected{
  border-color:#63ff54;
  box-shadow:0 0 15px #63ff5466;
}

.characterPreview{
  height:74px;
  position:relative;
  overflow:hidden;
  border-radius:9px;
  background:linear-gradient(#8edfff,#effcff);
}

.pHead{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ffd0aa;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  border:2px solid #b16e4c;
}

.pHair{
  position:absolute;
  width:42px;
  height:25px;
  border-radius:50% 50% 30% 30%;
  top:4px;
  left:50%;
  transform:translateX(-50%);
  background:#56351f;
}

.pBody{
  position:absolute;
  width:42px;
  height:38px;
  bottom:-5px;
  left:50%;
  transform:translateX(-50%);
  border-radius:15px 15px 5px 5px;
  background:#192b3c;
}

.character small{
  color:#ffd21b;
  font-size:9px;
}

.info{
  margin-top:14px;
  padding:9px;
  background:#09263de8;
  border:2px solid #39c1ff;
  border-radius:13px;
  color:#fff;
  font-size:11px;
  font-weight:900;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">
  <div>⭐ <span id="score">00000</span></div>
  <div>🪙 <span id="coins">0</span></div>
  <div>🏃 <span id="distance">0</span>m</div>
</div>

<button class="pause" onclick="togglePause()">⏸</button>

<div class="controls">
  <button onclick="laneMove(-1)">◀</button>
  <button onclick="playerJump()">⬆</button>
  <button onclick="playerSlide()">⬇</button>
  <button onclick="laneMove(1)">▶</button>
</div>

<!-- HOME -->

<div id="home">

  <div class="home">

    <div class="logo">
      ABEY<br>
      <span>BHAAG!</span>
    </div>

    <div class="tag">
      Pakray gaye to Game Over! 🎮
    </div>

    <button class="play" onclick="startGame()">
      ▶ PLAY
    </button>

    <div class="characterTitle">
      SELECT CHARACTER
    </div>

    <div class="characters" id="characters"></div>

    <div class="info">
      3 LANE RUNNER • TRAINS • COINS • OBSTACLES
    </div>

  </div>

</div>

<!-- GAME OVER -->

<div id="gameOver">

  <div class="over">

    <h2>GAME OVER!</h2>

    <p>Obstacle se takra gaye 😱</p>

    <p style="margin-top:10px">
      ⭐ Score: <b id="finalScore">0</b>
    </p>

    <p style="margin-top:5px">
      🪙 Coins: <b id="finalCoins">0</b>
    </p>

    <button class="restart" onclick="startGame()">
      🔄 RUN AGAIN
    </button>

  </div>

</div>

</div>

<script>

/* =========================================
   CANVAS
========================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let DPR=1;

function resize(){

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================
   CHARACTERS
========================================= */

const characters=[
  {name:"Adrien",price:"FREE",hair:"#263a55",shirt:"#173f73"},
  {name:"MrBeast",price:"🪙 1000",hair:"#51311e",shirt:"#168dd0"},
  {name:"Doraemon",price:"🪙 500",hair:"#5c93b5",shirt:"#188bc8"},
  {name:"Ronaldo",price:"🪙 2000",hair:"#20252d",shirt:"#d83b3b"}
];

let selected="Adrien";

function renderCharacters(){

  const box=document.getElementById("characters");

  box.innerHTML="";

  characters.forEach(c=>{

    const b=document.createElement("button");

    b.className=
      "character"+
      (selected===c.name?" selected":"");

    b.innerHTML=`
      <div class="characterPreview">
        <div class="pHair" style="background:${c.hair}"></div>
        <div class="pHead"></div>
        <div class="pBody" style="background:${c.shirt}"></div>
      </div>
      <div>${c.name}</div>
      <small>${c.price}</small>
    `;

    b.onclick=()=>{
      selected=c.name;
      renderCharacters();
    };

    box.appendChild(b);
  });
}

renderCharacters();


/* =========================================
   GAME STATE
========================================= */

let running=false;
let paused=false;

let last=0;
let raf=0;

let score=0;
let coins=0;
let distance=0;

let speed=.0075;
let world=0;

let spawnTimer=0;

let objects=[];

let currentLane=1;
let targetLane=1;

let action="";
let actionUntil=0;

let runTime=0;


/* =========================================
   START
========================================= */

function startGame(){

  document.getElementById("home").style.display="none";
  document.getElementById("gameOver").style.display="none";

  running=true;
  paused=false;

  score=0;
  coins=0;
  distance=0;

  speed=.0075;
  world=0;
  spawnTimer=0;

  objects=[];

  currentLane=1;
  targetLane=1;

  action="";
  runTime=0;

  last=performance.now();

  cancelAnimationFrame(raf);

  raf=requestAnimationFrame(loop);
}


/* =========================================
   PAUSE
========================================= */

function togglePause(){

  if(!running)return;

  paused=!paused;

  if(!paused){

    last=performance.now();

    raf=requestAnimationFrame(loop);
  }
}


/* =========================================
   CONTROLS
========================================= */

function laneMove(d){

  if(!running||paused)return;

  targetLane+=d;

  targetLane=Math.max(
    0,
    Math.min(2,targetLane)
  );
}

function playerJump(){

  if(!running||paused)return;

  if(action)return;

  action="jump";
  actionUntil=performance.now()+720;
}

function playerSlide(){

  if(!running||paused)return;

  if(action)return;

  action="slide";
  actionUntil=performance.now()+650;
}


/* =========================================
   KEYBOARD
========================================= */

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft")laneMove(-1);
  if(e.key==="ArrowRight")laneMove(1);
  if(e.key==="ArrowUp")playerJump();
  if(e.key==="ArrowDown")playerSlide();

});


/* =========================================
   SWIPE
========================================= */

let sx=0;
let sy=0;

canvas.addEventListener("touchstart",e=>{

  const t=e.changedTouches[0];

  sx=t.clientX;
  sy=t.clientY;

},{passive:true});


canvas.addEventListener("touchend",e=>{

  const t=e.changedTouches[0];

  const dx=t.clientX-sx;
  const dy=t.clientY-sy;

  if(Math.max(Math.abs(dx),Math.abs(dy))<25)
    return;

  if(Math.abs(dx)>Math.abs(dy)){

    laneMove(dx>0?1:-1);

  }else{

    if(dy<0)
      playerJump();
    else
      playerSlide();

  }

},{passive:true});


/* =========================================
   GAME LOOP
========================================= */

function loop(now){

  if(!running)return;

  const dt=Math.min(
    2,
    (now-last)/16.67
  );

  last=now;

  if(!paused)
    update(dt,now);

  draw();

  raf=requestAnimationFrame(loop);
}


/* =========================================
   UPDATE
========================================= */

function update(dt,now){

  runTime+=dt;

  /* ROAD SPEED */

  world+=speed*dt*100;

  speed=Math.min(
    .018,
    speed+.0000018*dt
  );


  /* PLAYER LANE */

  currentLane+=
    (targetLane-currentLane)
    *.18*dt;


  /* ACTION */

  if(action && now>actionUntil)
    action="";


  /* SCORE */

  score+=Math.floor(1.5*dt);

  distance+=Math.floor(
    speed*13*dt
  );


  /* OBJECT SPAWN */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnObject();

    spawnTimer=
      38+
      Math.random()*30;
  }


  /* MOVE EVERYTHING */

  objects.forEach(o=>{
    o.z+=speed*dt;
  });


  /* COLLISION */

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o=objects[i];

    if(
      o.z>.82 &&
      o.z<1.02 &&
      Math.abs(o.lane-currentLane)<.31 &&
      !o.checked
    ){

      o.checked=true;

      if(o.type==="coin"){

        coins++;

        objects.splice(i,1);

        continue;
      }


      let safe=false;

      if(
        o.type==="barrier" &&
        action==="jump"
      ){
        safe=true;
      }

      if(
        o.type==="train" &&
        action==="slide"
      ){
        safe=true;
      }


      if(!safe){

        gameOver();

        return;
      }

    }


    if(o.z>1.12){

      objects.splice(i,1);
    }

  }


  document.getElementById("score")
    .textContent=
    String(score).padStart(5,"0");

  document.getElementById("coins")
    .textContent=coins;

  document.getElementById("distance")
    .textContent=distance;
}


/* =========================================
   SPAWN
========================================= */

function spawnObject(){

  const lane=
    Math.floor(Math.random()*3);

  const r=Math.random();

  let type;

  if(r<.48)
    type="coin";
  else if(r<.72)
    type="barrier";
  else
    type="train";


  objects.push({
    type,
    lane,
    z:-.08,
    checked:false,
    spin:Math.random()*10
  });


  /* COINS NEAR OBSTACLES */

  if(type==="barrier"){

    objects.push({
      type:"coin",
      lane:(lane+1)%3,
      z:-.27,
      checked:false,
      spin:0
    });

  }


  if(type==="train"){

    objects.push({
      type:"coin",
      lane:(lane+2)%3,
      z:-.24,
      checked:false,
      spin:0
    });

  }

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

  running=false;

  document.getElementById("finalScore")
    .textContent=score;

  document.getElementById("finalCoins")
    .textContent=coins;

  document.getElementById("gameOver")
    .style.display="flex";
}


/* =========================================
   PERSPECTIVE
========================================= */

function roadY(z){

  return H*.39+
    (H*.96-H*.39)*z;
}

function roadWidth(z){

  return W*.15+
    (W*.75-W*.15)*z;
}

function laneX(l,z){

  return W/2+
    (l-1)*
    roadWidth(z)*
    .62;
}


/* =========================================
   DRAW
========================================= */

function draw(){

  ctx.clearRect(
    0,0,W,H
  );

  drawSky();
  drawCity();
  drawRoad();
  drawStreetObjects();
  drawGameObjects();
  drawPlayer();
  drawCrowd();

}


/* =========================================
   SKY
========================================= */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,0,0,H*.5
    );

  g.addColorStop(
    0,
    "#16aaf0"
  );

  g.addColorStop(
    1,
    "#dcf8ff"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H*.55
  );


  /* SUN */

  ctx.fillStyle="#ffe66b";

  ctx.beginPath();

  ctx.arc(
    W*.82,
    H*.11,
    28,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* CLOUDS */

  drawCloud(
    W*.18,
    H*.15,
    1
  );

  drawCloud(
    W*.56,
    H*.22,
    .75
  );

}

function drawCloud(x,y,s){

  ctx.fillStyle="#ffffffaa";

  ctx.beginPath();

  ctx.arc(x,y,18*s,0,Math.PI*2);
  ctx.arc(x+20*s,y-7*s,24*s,0,Math.PI*2);
  ctx.arc(x+44*s,y,18*s,0,Math.PI*2);

  ctx.fill();
}


/* =========================================
   CITY
========================================= */

function drawCity(){

  const shift1=
    (world*.045)%W;

  const shift2=
    (world*.025)%W;


  /* FAR BUILDINGS */

  for(let i=-2;i<12;i++){

    const x=i*80-shift2;

    const h=
      55+
      ((i*31)%80+80)%80;

    ctx.fillStyle="#719cac";

    ctx.fillRect(
      x,
      H*.43-h,
      72,
      h
    );

    ctx.fillStyle="#d8f3fa";

    for(let r=0;r<4;r++){

      for(let c=0;c<2;c++){

        ctx.fillRect(
          x+13+c*28,
          H*.43-h+14+r*22,
          10,
          7
        );

      }
    }
  }


  /* NEAR BUILDINGS */

  for(let i=-2;i<10;i++){

    const x=i*105-shift1;

    const h=
      75+
      ((i*47)%100+100)%100;

    ctx.fillStyle="#547b90";

    ctx.fillRect(
      x,
      H*.44-h,
      94,
      h
    );

    ctx.fillStyle="#cfeaf0";

    for(let r=0;r<5;r++){

      for(let c=0;c<2;c++){

        ctx.fillRect(
          x+17+c*34,
          H*.44-h+16+r*25,
          12,
          9
        );

      }
    }
  }

}


/* =========================================
   ROAD
========================================= */

function drawRoad(){

  const hy=H*.39;


  /* GROUND */

  ctx.fillStyle="#999991";

  ctx.fillRect(
    0,
    hy,
    W,
    H-hy
  );


  /* ROAD */

  ctx.fillStyle="#41484e";

  ctx.beginPath();

  ctx.moveTo(
    W*.27,
    hy
  );

  ctx.lineTo(
    W*.73,
    hy
  );

  ctx.lineTo(
    W*1.08,
    H
  );

  ctx.lineTo(
    -W*.08,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* ROAD EDGE */

  ctx.strokeStyle="#e9e9e9";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    W*.27,
    hy
  );

  ctx.lineTo(
    -W*.08,
    H
  );

  ctx.moveTo(
    W*.73,
    hy
  );

  ctx.lineTo(
    W*1.08,
    H
  );

  ctx.stroke();


  /* MOVING LANE LINES */

  const dividerPositions=[
    -.16,
    .16
  ];

  dividerPositions.forEach(pos=>{

    for(let i=0;i<15;i++){

      const z=
        (i*.09+
        world*.0018)%1;

      const y=
        roadY(z);

      const x=
        W/2+
        pos*2*
        roadWidth(z);

      const len=
        7+z*30;

      ctx.fillStyle="#fff";

      ctx.fillRect(
        x-2,
        y,
        4,
        len
      );

    }

  });


  /* CENTER ROAD TEXTURE */

  for(let i=0;i<25;i++){

    const z=
      (i*.055+
      world*.0008)%1;

    const y=
      roadY(z);

    const w=
      1+z*5;

    ctx.fillStyle="#555c61";

    ctx.fillRect(
      W/2-w,
      y,
      w*2,
      2+z*4
    );

  }

}


/* =========================================
   SIDE STREET DETAILS
========================================= */

function drawStreetObjects(){

  const offset=
    (world*.13)%120;

  for(let i=-2;i<9;i++){

    const y=
      H*.39+
      i*105+
      offset;

    if(y>H*.9)
      continue;


    const z=
      Math.max(
        0,
        Math.min(
          1,
          (y-H*.39)/
          (H*.61)
        )
      );


    const s=
      .4+
      z*.8;


    drawLamp(
      35,
      y,
      s
    );

    drawLamp(
      W-35,
      y+25,
      s
    );

  }

}


function drawLamp(x,y,s){

  ctx.save();

  ctx.translate(x,y);

  ctx.scale(s,s);

  ctx.strokeStyle="#304654";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(0,-95);
  ctx.lineTo(22,-95);

  ctx.stroke();


  ctx.fillStyle="#ffe96b";

  ctx.beginPath();

  ctx.arc(
    22,
    -95,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================
   GAME OBJECTS
========================================= */

function drawGameObjects(){

  objects
    .slice()
    .sort((a,b)=>a.z-b.z)
    .forEach(o=>{

      const z=
        Math.max(
          0,
          Math.min(1,o.z)
        );

      const x=
        laneX(
          o.lane,
          z
        );

      const y=
        roadY(z);

      const scale=
        .30+
        z*1.22;


      ctx.save();

      ctx.translate(
        x,
        y
      );

      ctx.scale(
        scale,
        scale
      );


      if(o.type==="coin")
        drawCoin(o);

      else if(o.type==="barrier")
        drawBarrier();

      else
        drawTrain();


      ctx.restore();

    });

}


/* =========================================
   3D COIN
========================================= */

function drawCoin(o){

  const spin=
    Math.sin(
      (world*.08)+o.spin
    );

  const width=
    Math.max(
      4,
      20*Math.abs(spin)
    );


  ctx.fillStyle="#ffc719";

  ctx.strokeStyle="#fff1a2";

  ctx.lineWidth=3;


  ctx.beginPath();

  ctx.ellipse(
    0,
    -9,
    width,
    27,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();


  if(width>9){

    ctx.fillStyle="#a86a00";

    ctx.font="bold 19px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "★",
      0,
      -3
    );

  }

}


/* =========================================
   BETTER BARRIER
========================================= */

function drawBarrier(){

  /* SHADOW */

  ctx.fillStyle="#0005";

  ctx.beginPath();

  ctx.ellipse(
    0,
    19,
    42,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* SUPPORTS */

  ctx.fillStyle="#263746";

  ctx.fillRect(
    -31,
    -30,
    7,
    55
  );

  ctx.fillRect(
    24,
    -30,
    7,
    55
  );


  /* BOARD */

  ctx.fillStyle="#f2f2ed";

  ctx.beginPath();

  ctx.roundRect(
    -38,
    -42,
    76,
    48,
    5
  );

  ctx.fill();


  /* RED STRIPES */

  ctx.fillStyle="#e23e37";

  for(let x=-42;x<45;x+=22){

    ctx.save();

    ctx.beginPath();

    ctx.rect(
      x,
      -44,
      14,
      54
    );

    ctx.clip();

    ctx.translate(
      x,
      -44
    );

    ctx.rotate(-.55);

    ctx.fillRect(
      0,
      0,
      15,
      70
    );

    ctx.restore();

  }


  ctx.strokeStyle="#293a48";

  ctx.lineWidth=4;

  ctx.strokeRect(
    -38,
    -42,
    76,
    48
  );

}

  /* WINDOW REFLECTION */

  );

  );

  );

  );

/* =========================================
   PLAYER CHARACTER
========================================= */

function drawPlayer(){

  const x=
    laneX(
      currentLane,
      .90
    );

  let y=
    H*.78;


  let jumpHeight=0;

  if(action==="jump"){

    const remaining=
      Math.max(
        0,
        actionUntil-performance.now()
      );

    const progress=
      1-
      remaining/720;

    jumpHeight=
      Math.sin(
        progress*Math.PI
      )*92;

    y-=jumpHeight;

  }


  if(action==="slide")
    y+=23;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  const runningFrame=
    Math.sin(
      runTime*.55
    );


  /* SHADOW */

  ctx.fillStyle="#0006";

  ctx.beginPath();

  ctx.ellipse(
    0,
    62,
    38,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* LEGS - RUNNING ANIMATION */

  ctx.lineCap="round";

  ctx.strokeStyle="#17283a";

  ctx.lineWidth=13;

  ctx.beginPath();

  ctx.moveTo(
    -8,
    18
  );

  ctx.lineTo(
    -23-runningFrame*9,
    51
  );

  ctx.moveTo(
    8,
    18
  );

  ctx.lineTo(
    24+runningFrame*9,
    51
  );

  ctx.stroke();


  /* SHOES */

  ctx.strokeStyle="#f5f5f5";

  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    -23-runningFrame*9,
    51
  );

  ctx.lineTo(
    -5-runningFrame*9,
    51
  );

  ctx.moveTo(
    24+runningFrame*9,
    51
  );

  ctx.lineTo(
    42+runningFrame*9,
    51
  );

  ctx.stroke();


  /* BODY */

  let shirt="#173f73";

  if(selected==="MrBeast")
    shirt="#168dd0";

  if(selected==="Doraemon")
    shirt="#168bc5";

  if(selected==="Ronaldo")
    shirt="#d83b3b";


  ctx.fillStyle=shirt;

  ctx.beginPath();

  ctx.roundRect(
    -27,
    -32,
    54,
    62,
    17
  );

  ctx.fill();


  /* SHIRT DETAIL */

  ctx.fillStyle="#ffffff33";

  ctx.fillRect(
    -22,
    -23,
    44,
    5
  );


  /* NECK */

  ctx.fillStyle="#d99d75";

  ctx.fillRect(
    -8,
    -37,
    16,
    13
  );


  /* HEAD */

  ctx.fillStyle="#ffd0aa";

  ctx.beginPath();

  ctx.arc(
    0,
    -56,
    26,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* EARS */

  ctx.beginPath();

  ctx.arc(
    -25,
    -55,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    25,
    -55,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* HAIR */

  let hair="#263a55";

  if(selected==="MrBeast")
    hair="#51311e";

  if(selected==="Doraemon")
    hair="#5c93b5";

  if(selected==="Ronaldo")
    hair="#20252d";


  ctx.fillStyle=hair;

  ctx.beginPath();

  ctx.arc(
    0,
    -67,
    28,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* HAIR LOCKS */

  if(selected!=="Doraemon"){

    for(let i=-2;i<=2;i++){

      ctx.beginPath();

      ctx.arc(
        i*8,
        -76+Math.abs(i)*2,
        9,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  /* EYES */

  if(selected==="Doraemon"){

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      -9,
      -57,
      7,
      0,
      Math.PI*2
    );

    ctx.arc(
      9,
      -57,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
      -9,
      -57,
      3,
      0,
      Math.PI*2
    );

    ctx.arc(
      9,
      -57,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();


  }else{

    ctx.fillStyle="#182333";

    ctx.beginPath();

    ctx.ellipse(
      -9,
      -56,
      3.5,
      5,
      0,
      0,
      Math.PI*2
    );

    ctx.ellipse(
      9,
      -56,
      3.5,
      5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* NOSE */

  ctx.fillStyle="#d99570";

  ctx.beginPath();

  ctx.arc(
    0,
    -50,
    2.5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* SMILE */

  ctx.strokeStyle="#7e3d35";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    0,
    -47,
    8,
    .15,
    Math.PI-.15
  );

  ctx.stroke();


  /* ARMS */

  const armSwing=
    Math.sin(
      runTime*.55
    )*12;


  ctx.strokeStyle="#ffd0aa";

  ctx.lineWidth=12;

  ctx.beginPath();

  ctx.moveTo(
    -22,
    -13
  );

  ctx.lineTo(
    -42,
    5+armSwing
  );

  ctx.moveTo(
    22,
    -13
  );

  ctx.lineTo(
    42,
    -27-armSwing
  );

  ctx.stroke();


  /* HANDS */

  ctx.fillStyle="#ffd0aa";

  ctx.beginPath();

  ctx.arc(
    -42,
    5+armSwing,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    42,
    -27-armSwing,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* DORAEMON CHEST */

  if(selected==="Doraemon"){

    ctx.fillStyle="#e9e9e9";

    ctx.beginPath();

    ctx.arc(
      0,
      7,
      13,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#e43d3d";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =========================================
   CROWD
========================================= */

function drawCrowd(){

  const offset=
    (world*.02)%45;

  for(let i=-1;i<13;i++){

    const x=
      i*(W/11)+offset;

    const y=
      H*.97;

    ctx.fillStyle=
      i%2
      ? "#19232c"
      : "#303b44";

    ctx.beginPath();

    ctx.arc(
      x,
      y-30,
      17,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ffd0aa";

    ctx.beginPath();

    ctx.arc(
      x,
      y-36,
      9,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* RAISED HAND */

    if(i%3===0){

      ctx.strokeStyle="#ffd0aa";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.moveTo(
        x+10,
        y-25
      );

      ctx.lineTo(
        x+22,
        y-52
      );

      ctx.stroke();

    }

  }

}


/* =========================================
   INITIAL
========================================= */

draw();

</script>

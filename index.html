<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abey Bhaag!</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#63d5ff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* HUD */

.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
}

.hudBox{
  background:#092840e8;
  border:3px solid white;
  border-radius:14px;
  padding:7px 11px;
  color:white;
  font-weight:1000;
  box-shadow:0 4px 10px #0006;
}

.pause{
  position:absolute;
  z-index:8;
  top:68px;
  left:10px;
  width:48px;
  height:48px;
  border:3px solid #17374d;
  border-radius:14px;
  background:white;
  font-size:20px;
}

/* CONTROLS */

.controls{
  position:absolute;
  z-index:8;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
}

.controls button{
  width:57px;
  height:48px;
  border:3px solid white;
  border-radius:14px;
  background:#092840dd;
  color:white;
  font-size:22px;
  font-weight:bold;
}

/* HOME */

.screen{
  position:absolute;
  inset:0;
  z-index:20;
}

#home{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(#15a9ed 0%,#dffaff 48%,#47768a 100%);
}

.homeBox{
  width:min(430px,94vw);
  text-align:center;
  padding:15px;
}

.logo{
  font-size:58px;
  line-height:.8;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-5px;
  color:#ffd51b;
  text-shadow:
    4px 5px #152b42,
    -2px -2px white;
}

.logo span{
  color:#0ac7ff;
}

.subtitle{
  margin:15px auto;
  display:inline-block;
  padding:8px 14px;
  border-radius:12px;
  border:3px solid #754900;
  background:#f5b31c;
  color:#17283b;
  font-weight:1000;
}

.playButton{
  width:85%;
  padding:13px;
  border:5px solid white;
  border-radius:40px;
  background:linear-gradient(#fff32b,#ff8b00);
  color:#17283b;
  font-size:32px;
  font-weight:1000;
  box-shadow:0 7px #884300;
  margin:8px auto 12px;
}

.storeButton{
  width:85%;
  padding:11px;
  border:4px solid white;
  border-radius:25px;
  background:#092d49;
  color:white;
  font-size:21px;
  font-weight:1000;
}

/* COIN BAR */

.coinBar{
  margin:10px auto;
  display:inline-block;
  padding:7px 16px;
  border-radius:18px;
  background:#092840ee;
  color:#ffd51b;
  border:3px solid white;
  font-weight:1000;
}

/* STORE */

#store{
  display:none;
  background:
    linear-gradient(#18aef0,#dffaff 55%,#557c8d);
  overflow:auto;
}

.storeHeader{
  width:min(480px,94vw);
  margin:0 auto;
  padding:14px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.storeHeader h1{
  color:white;
  font-size:31px;
  font-weight:1000;
  text-shadow:2px 3px #163247;
}

.backButton{
  border:3px solid white;
  border-radius:14px;
  background:#092840;
  color:white;
  padding:9px 14px;
  font-weight:1000;
}

.storeCoins{
  text-align:center;
  color:#ffd51b;
  font-size:21px;
  font-weight:1000;
  margin-bottom:10px;
}

.storeGrid{
  width:min(480px,94vw);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding-bottom:30px;
}

.card{
  background:#092840ed;
  border:3px solid #6bdcff;
  border-radius:18px;
  padding:8px;
  color:white;
  text-align:center;
}

.card.selected{
  border-color:#64ff50;
  box-shadow:0 0 18px #64ff5070;
}

.cardPreview{
  height:150px;
  border-radius:13px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#9eeaff,#eafcff);
  margin-bottom:7px;
}

/* mini character */

.miniHead{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#ffd0aa;
  top:21px;
  left:50%;
  transform:translateX(-50%);
  border:3px solid #9c6042;
}

.miniHair{
  position:absolute;
  width:67px;
  height:43px;
  border-radius:50% 50% 30% 30%;
  top:14px;
  left:50%;
  transform:translateX(-50%);
}

.miniBody{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:23px 23px 8px 8px;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
}

.miniEye{
  position:absolute;
  width:7px;
  height:10px;
  border-radius:50%;
  background:#172333;
  top:47px;
  z-index:3;
}

.e1{left:calc(50% - 16px);}
.e2{left:calc(50% + 9px);}

.card h2{
  font-size:20px;
}

.price{
  color:#ffd51b;
  font-weight:1000;
  margin:4px;
}

.buy{
  width:100%;
  padding:9px;
  border:0;
  border-radius:12px;
  background:linear-gradient(#ffe52b,#ff9200);
  color:#17283b;
  font-weight:1000;
  font-size:15px;
}

.buy.locked{
  background:#60727d;
  color:white;
}

.buy.selected{
  background:#55d84d;
  color:#12300f;
}

/* GAME OVER */

#gameOver{
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
}

.overBox{
  width:min(390px,92vw);
  padding:25px;
  text-align:center;
  background:#092840;
  border:4px solid #37c7ff;
  border-radius:23px;
  color:white;
}

.overBox h1{
  color:#ffd51b;
  font-size:39px;
}

.restart{
  width:100%;
  padding:12px;
  margin-top:16px;
  border:4px solid white;
  border-radius:17px;
  background:linear-gradient(#fff32b,#ff8b00);
  font-size:22px;
  font-weight:1000;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- GAME HUD -->

<div class="hud" id="hud">
  <div class="hudBox">⭐ <span id="score">00000</span></div>
  <div class="hudBox">🪙 <span id="coins">0</span></div>
  <div class="hudBox">🏃 <span id="distance">0</span>m</div>
</div>

<button class="pause" onclick="pauseGame()">⏸</button>

<div class="controls">
  <button onclick="moveLane(-1)">◀</button>
  <button onclick="jump()">⬆</button>
  <button onclick="slide()">⬇</button>
  <button onclick="moveLane(1)">▶</button>
</div>


<!-- HOME -->

<div id="home" class="screen">

  <div class="homeBox">

    <div class="logo">
      ABEY<br>
      <span>BHAAG!</span>
    </div>

    <div class="subtitle">
      Pakray gaye to Game Over! 🎮
    </div>

    <div class="coinBar">
      🪙 <span id="homeCoins">0</span>
    </div>

    <button class="playButton" onclick="startGame()">
      ▶ PLAY
    </button>

    <button class="storeButton" onclick="openStore()">
      🏪 CHARACTER STORE
    </button>

  </div>

</div>


<!-- STORE -->

<div id="store" class="screen">

  <div class="storeHeader">

    <button class="backButton" onclick="closeStore()">
      ← BACK
    </button>

    <h1>CHARACTER STORE</h1>

  </div>

  <div class="storeCoins">
    🪙 <span id="storeCoins">0</span>
  </div>

  <div class="storeGrid" id="storeGrid"></div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen">

  <div class="overBox">

    <h1>GAME OVER!</h1>

    <p style="margin-top:8px">
      Train/obstacle se takra gaye 😱
    </p>

    <p style="margin-top:12px">
      ⭐ Score: <b id="finalScore">0</b>
    </p>

    <p style="margin-top:5px">
      🪙 Coins: <b id="finalCoins">0</b>
    </p>

    <button class="restart" onclick="startGame()">
      🔄 RUN AGAIN
    </button>

  </div>

</div>

</div>

<script>

/* =========================================
   CANVAS
========================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0,DPR=1;

function resize(){

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  DPR=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

window.addEventListener("resize",resize);
resize();


/* =========================================
   CHARACTERS
========================================= */

const characters=[

  {
    id:"adrien",
    name:"Adrien",
    price:0,
    hair:"#263a55",
    shirt:"#173f73"
  },

  {
    id:"doraemon",
    name:"Doraemon",
    price:500,
    hair:"#65a9c8",
    shirt:"#188bc8"
  },

  {
    id:"mrbeast",
    name:"Mr Beast",
    price:1000,
    hair:"#51311e",
    shirt:"#168dd0"
  },

  {
    id:"ronaldo",
    name:"Ronaldo",
    price:2000,
    hair:"#20252d",
    shirt:"#d83b3b"
  }

];


/* =========================================
   SAVE DATA
========================================= */

let wallet=
  Number(
    localStorage.getItem("abeyCoins")||"0"
  );

let owned=
  JSON.parse(
    localStorage.getItem("abeyOwned")||
    '["adrien"]'
  );

let selected=
  localStorage.getItem(
    "abeySelected"
  )||"adrien";


function save(){

  localStorage.setItem(
    "abeyCoins",
    wallet
  );

  localStorage.setItem(
    "abeyOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "abeySelected",
    selected
  );

  updateWallet();
}


function updateWallet(){

  document.getElementById(
    "homeCoins"
  ).textContent=wallet;

  document.getElementById(
    "storeCoins"
  ).textContent=wallet;
}


/* =========================================
   STORE
========================================= */

function openStore(){

  document.getElementById(
    "home"
  ).style.display="none";

  document.getElementById(
    "store"
  ).style.display="block";

  renderStore();
}


function closeStore(){

  document.getElementById(
    "store"
  ).style.display="none";

  document.getElementById(
    "home"
  ).style.display="flex";

  updateWallet();
}


function renderStore(){

  const grid=
    document.getElementById(
      "storeGrid"
    );

  grid.innerHTML="";


  characters.forEach(c=>{

    const isOwned=
      owned.includes(c.id);

    const isSelected=
      selected===c.id;


    const card=
      document.createElement("div");

    card.className=
      "card"+
      (isSelected?" selected":"");


    card.innerHTML=`

      <div class="cardPreview">

        <div
          class="miniHair"
          style="background:${c.hair}">
        </div>

        <div class="miniHead"></div>

        <div class="miniEye e1"></div>
        <div class="miniEye e2"></div>

        <div
          class="miniBody"
          style="background:${c.shirt}">
        </div>

      </div>

      <h2>${c.name}</h2>

      <div class="price">
        ${
          isOwned
          ? "OWNED"
          : "🪙 "+c.price
        }
      </div>

      <button class="buy ${
        isSelected
        ? "selected"
        : (!isOwned?"locked":"")
      }">

        ${
          isSelected
          ? "✓ SELECTED"
          : isOwned
          ? "SELECT"
          : "🪙 BUY"
        }

      </button>
    `;


    const button=
      card.querySelector(".buy");


    button.onclick=()=>{

      /* BUY */

      if(!isOwned){

        if(wallet<c.price){

          alert(
            "Coins kam hain! 🪙\n"+
            "Game khel kar coins collect karo."
          );

          return;
        }

        wallet-=c.price;

        owned.push(c.id);

        selected=c.id;

        save();

        renderStore();

        return;
      }


      /* SELECT */

      selected=c.id;

      save();

      renderStore();

    };


    grid.appendChild(card);

  });

}


updateWallet();


/* =========================================
   GAME STATE
========================================= */

let running=false;
let paused=false;

let score=0;
let collectedCoins=0;
let distance=0;

let speed=.0075;
let world=0;

let objects=[];
let spawnTimer=0;

let currentLane=1;
let targetLane=1;

let action="";
let actionEnd=0;

let runTime=0;
let lastTime=0;
let animation;


/* =========================================
   START GAME
========================================= */

function startGame(){

  document.getElementById(
    "home"
  ).style.display="none";

  document.getElementById(
    "store"
  ).style.display="none";

  document.getElementById(
    "gameOver"
  ).style.display="none";


  running=true;
  paused=false;

  score=0;
  collectedCoins=0;
  distance=0;

  speed=.0075;
  world=0;

  objects=[];

  spawnTimer=0;

  currentLane=1;
  targetLane=1;

  action="";
  runTime=0;

  lastTime=
    performance.now();

  cancelAnimationFrame(animation);

  animation=
    requestAnimationFrame(loop);
}


/* =========================================
   LOOP
========================================= */

function loop(now){

  if(!running)
    return;

  const dt=
    Math.min(
      2,
      (now-lastTime)/16.67
    );

  lastTime=now;


  if(!paused){

    update(dt,now);
    draw();

  }


  animation=
    requestAnimationFrame(loop);
}


/* =========================================
   PAUSE
========================================= */

function pauseGame(){

  if(!running)
    return;

  paused=!paused;

  if(!paused){

    lastTime=
      performance.now();

  }
}


/* =========================================
   CONTROLS
========================================= */

function moveLane(dir){

  if(!running||paused)
    return;

  targetLane+=dir;

  targetLane=
    Math.max(
      0,
      Math.min(
        2,
        targetLane
      )
    );
}


function jump(){

  if(!running||paused||action)
    return;

  action="jump";

  actionEnd=
    performance.now()+720;
}


function slide(){

  if(!running||paused||action)
    return;

  action="slide";

  actionEnd=
    performance.now()+650;
}


/* =========================================
   KEYBOARD
========================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLane(-1);

    if(e.key==="ArrowRight")
      moveLane(1);

    if(e.key==="ArrowUp")
      jump();

    if(e.key==="ArrowDown")
      slide();

  }
);


/* =========================================
   TOUCH
========================================= */

let startX=0;
let startY=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    startX=t.clientX;
    startY=t.clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  e=>{

    const t=e.changedTouches[0];

    const dx=t.clientX-startX;
    const dy=t.clientY-startY;

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<25
    )
      return;


    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      moveLane(
        dx>0?1:-1
      );

    }else{

      if(dy<0)
        jump();
      else
        slide();

    }

  },
  {passive:true}
);


/* =========================================
   UPDATE
========================================= */

function update(dt,now){

  runTime+=dt;

  world+=
    speed*100*dt;


  /* gradually increase difficulty */

  speed=
    Math.min(
      .018,
      speed+.0000017*dt
    );


  /* lane movement */

  currentLane+=
    (
      targetLane-currentLane
    )*.18*dt;


  /* action */

  if(
    action &&
    now>actionEnd
  ){

    action="";

  }


  /* score */

  score+=
    Math.floor(1.5*dt);


  distance+=
    Math.floor(
      speed*13*dt
    );


  /* spawn */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnObject();

    spawnTimer=
      35+
      Math.random()*28;
  }


  /* objects */

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o=objects[i];

    o.z+=
      speed*dt;


    if(
      o.z>.80 &&
      o.z<1.03 &&
      Math.abs(
        o.lane-currentLane
      )<.30 &&
      !o.checked
    ){

      o.checked=true;


      /* COIN */

      if(o.type==="coin"){

        collectedCoins++;

        objects.splice(i,1);

        continue;
      }


      let safe=false;


      /* jump over barrier */

      if(
        o.type==="barrier" &&
        action==="jump"
      ){

        safe=true;

      }


      /* slide under train sign */

      if(
        o.type==="train" &&
        action==="slide"
      ){

        safe=true;

      }


      if(!safe){

        gameOver();

        return;
      }

    }


    if(o.z>1.13){

      objects.splice(i,1);

    }

  }


  document.getElementById(
    "score"
  ).textContent=
    String(score).padStart(5,"0");


  document.getElementById(
    "coins"
  ).textContent=
    collectedCoins;


  document.getElementById(
    "distance"
  ).textContent=
    distance;

}


/* =========================================
   SPAWN OBJECT
========================================= */

function spawnObject(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  const random=
    Math.random();

  let type;


  if(random<.45)
    type="coin";
  else if(random<.70)
    type="barrier";
  else
    type="train";


  objects.push({

    type:type,
    lane:lane,
    z:-.08,
    checked:false,
    spin:Math.random()*10

  });


  /* coin patterns */

  if(type==="coin"){

    for(let i=1;i<5;i++){

      objects.push({

        type:"coin",
        lane:lane,
        z:-.08-i*.09,
        checked:false,
        spin:i

      });

    }

  }


  /* side coin when obstacle */

  if(type==="barrier"){

    const side=
      lane===0
      ?1
      :lane===2
      ?1
      :Math.random()<.5
      ?0
      :2;


    objects.push({

      type:"coin",
      lane:side,
      z:-.22,
      checked:false,
      spin:0

    });

  }

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

  running=false;


  wallet+=collectedCoins;

  save();


  document.getElementById(
    "finalScore"
  ).textContent=score;


  document.getElementById(
    "finalCoins"
  ).textContent=collectedCoins;


  document.getElementById(
    "gameOver"
  ).style.display="flex";
}


/* =========================================
   PERSPECTIVE
========================================= */

function roadY(z){

  return H*.39+
    (H*.96-H*.39)*z;

}


function roadWidth(z){

  return W*.15+
    (W*.75-W*.15)*z;

}


function laneX(lane,z){

  return W/2+
    (lane-1)*
    roadWidth(z)*.62;

}


/* =========================================
   DRAW
========================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawSky();
  drawCity();
  drawRoad();
  drawStreet();
  drawObjects();
  drawPlayer();
  drawCrowd();

}


/* =========================================
   SKY
========================================= */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H*.5
    );

  g.addColorStop(
    0,
    "#14aaf0"
  );

  g.addColorStop(
    1,
    "#e2faff"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H*.55
  );


  ctx.fillStyle="#ffe86b";

  ctx.beginPath();

  ctx.arc(
    W*.82,
    H*.11,
    28,
    0,
    Math.PI*2
  );

  ctx.fill();


  cloud(
    W*.18,
    H*.15,
    1
  );

  cloud(
    W*.58,
    H*.22,
    .75
  );

}


function cloud(x,y,s){

  ctx.fillStyle="#ffffffaa";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    18*s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+21*s,
    y-8*s,
    24*s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+45*s,
    y,
    18*s,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================================
   CITY
========================================= */

function drawCity(){

  const far=
    (world*.025)%90;

  const near=
    (world*.05)%115;


  for(
    let i=-2;
    i<12;
    i++
  ){

    const x=
      i*85-far;

    const h=
      55+
      ((i*37)%80+80)%80;


    ctx.fillStyle="#759dab";

    ctx.fillRect(
      x,
      H*.43-h,
      75,
      h
    );


    ctx.fillStyle="#d5f2f7";

    for(
      let r=0;
      r<4;
      r++
    ){

      for(
        let c=0;
        c<2;
        c++
      ){

        ctx.fillRect(
          x+13+c*28,
          H*.43-h+14+r*22,
          10,
          7
        );

      }

    }

  }


  for(
    let i=-2;
    i<11;
    i++
  ){

    const x=
      i*110-near;

    const h=
      80+
      ((i*43)%100+100)%100;


    ctx.fillStyle="#557c91";

    ctx.fillRect(
      x,
      H*.44-h,
      98,
      h
    );


    ctx.fillStyle="#cdeaf1";

    for(
      let r=0;
      r<5;
      r++
    ){

      for(
        let c=0;
        c<2;
        c++
      ){

        ctx.fillRect(
          x+17+c*35,
          H*.44-h+16+r*25,
          12,
          9
        );

      }

    }

  }

}


/* =========================================
   ROAD
========================================= */

function drawRoad(){

  const horizon=
    H*.39;


  ctx.fillStyle="#969791";

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );


  /* road */

  ctx.fillStyle="#41484d";

  ctx.beginPath();

  ctx.moveTo(
    W*.27,
    horizon
  );

  ctx.lineTo(
    W*.73,
    horizon
  );

  ctx.lineTo(
    W*1.08,
    H
  );

  ctx.lineTo(
    -W*.08,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* road borders */

  ctx.strokeStyle="#eeeeee";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    W*.27,
    horizon
  );

  ctx.lineTo(
    -W*.08,
    H
  );

  ctx.moveTo(
    W*.73,
    horizon
  );

  ctx.lineTo(
    W*1.08,
    H
  );

  ctx.stroke();


  /* moving lane marks */

  for(
    let laneLine of [-.16,.16]
  ){

    for(
      let i=0;
      i<18;
      i++
    ){

      const z=
        (
          i*.075+
          world*.0018
        )%1;


      const y=
        roadY(z);


      const x=
        W/2+
        laneLine*
        2*
        roadWidth(z);


      const len=
        7+
        z*30;


      ctx.fillStyle="#fff";

      ctx.fillRect(
        x-2,
        y,
        4,
        len
      );

    }

  }

}


/* =========================================
   STREET
========================================= */

function drawStreet(){

  const offset=
    (world*.12)%115;


  for(
    let i=-2;
    i<10;
    i++
  ){

    const y=
      H*.39+
      i*110+
      offset;


    if(
      y< H*.42 ||
      y>H*.93
    )
      continue;


    const z=
      Math.max(
        .1,
        Math.min(
          1,
          (y-H*.39)/(H*.61)
        )
      );


    const s=
      .35+
      z*.8;


    drawLamp(
      34,
      y,
      s
    );

    drawLamp(
      W-34,
      y+20,
      s
    );

  }

}


function drawLamp(x,y,s){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    s,
    s
  );

  ctx.strokeStyle="#304754";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(0,-90);
  ctx.lineTo(21,-90);

  ctx.stroke();


  ctx.fillStyle="#ffe96b";

  ctx.beginPath();

  ctx.arc(
    21,
    -90,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================================
   OBJECTS
========================================= */

function drawObjects(){

  objects
    .slice()
    .sort(
      (a,b)=>a.z-b.z
    )
    .forEach(o=>{

      const z=
        Math.max(
          0,
          Math.min(1,o.z)
        );


      const x=
        laneX(
          o.lane,
          z
        );


      const y=
        roadY(z);


      const scale=
        .30+
        z*1.23;


      ctx.save();

      ctx.translate(
        x,
        y
      );

      ctx.scale(
        scale,
        scale
      );


      if(o.type==="coin")
        drawCoin(o);

      if(o.type==="barrier")
        drawBarrier();

      if(o.type==="train")
        drawTrain();


      ctx.restore();

    });

}


/* =========================================
   COIN
========================================= */

function drawCoin(o){

  const spin=
    Math.sin(
      world*.08+
      o.spin
    );


  const w=
    Math.max(
      4,
      20*Math.abs(spin)
    );


  ctx.fillStyle="#ffc719";

  ctx.strokeStyle="#fff3a3";

  ctx.lineWidth=3;


  ctx.beginPath();

  ctx.ellipse(
    0,
    -12,
    w,
    27,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.stroke();


  if(w>10){

    ctx.fillStyle="#9a6200";

    ctx.font="bold 20px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "★",
      0,
      -6
    );

  }

}


/* =========================================
   BARRIER
========================================= */

function drawBarrier(){

  /* shadow */

  ctx.fillStyle="#0006";

  ctx.beginPath();

  ctx.ellipse(
    0,
    22,
    45,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.fillStyle="#263744";

  ctx.fillRect(
    -34,
    -32,
    8,
    55
  );

  ctx.fillRect(
    26,
    -32,
    8,
    55
  );


  /* board */

  ctx.fillStyle="#f4f2e9";

  ctx.fillRect(
    -42,
    -48,
    84,
    54
  );


  /* stripes */

  ctx.fillStyle="#e34239";

  for(
    let x=-48;
    x<50;
    x+=23
  ){

    ctx.save();

    ctx.beginPath();

    ctx.rect(
      x,
      -50,
      15,
      58
    );

    ctx.clip();

    ctx.translate(
      x,
      -50
    );

    ctx.rotate(-.55);

    ctx.fillRect(
      0,
      0,
      15,
      75
    );

    ctx.restore();

  }


  ctx.strokeStyle="#263845";

  ctx.lineWidth=4;

  ctx.strokeRect(
    -42,
    -48,
    84,
    54
  );

}


/* =========================================
   TRAIN
========================================= */

function drawTrain(){

  /* shadow */

  ctx.fillStyle="#0007";

  ctx.beginPath();

  ctx.ellipse(
    0,
    35,
    51,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* main train */

  const g=
    ctx.createLinearGradient(
      -40,
      -105,
      40,
      35
    );

  g.addColorStop(
    0,
    "#48c8f4"
  );

  g.addColorStop(
    .45,
    "#0b83c5"
  );

  g.addColorStop(
    1,
    "#05466e"
  );


  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.roundRect(
    -40,
    -105,
    80,
    138,
    11
  );

  ctx.fill();


  /* roof */

  ctx.fillStyle="#173a4e";

  ctx.beginPath();

  ctx.roundRect(
    -44,
    -111,
    88,
    17,
    8
  );

  ctx.fill();


  /* windshield */

  ctx.fillStyle="#08273d";

  ctx.beginPath();

  ctx.roundRect(
    -31,
    -79,
    62,
    47,
    9
  );

  ctx.fill();


  /* glass */

  ctx.fillStyle="#b9edf9";

  ctx.beginPath();

  ctx.moveTo(
    -24,
    -71
  );

  ctx.lineTo(
    -3,
    -71
  );

  ctx.lineTo(
    -10,
    -39
  );

  ctx.lineTo(
    -26,
    -39
  );

  ctx.closePath();

  ctx.fill();


  ctx.fillRect(
    5,
    -70,
    20,
    30
  );


  /* headlights */

  ctx.fillStyle="#fff2a0";

  ctx.beginPath();

  ctx.arc(
    -24,
    7,
    9,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    7,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    -24,
    7,
    4,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    7,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* bumper */

  ctx.fillStyle="#0b3047";

  ctx.fillRect(
    -40,
    21,
    80,
    12
  );


  /* coupler */

  ctx.fillStyle="#152832";

  ctx.fillRect(
    -13,
    33,
    26,
    10
  );


  /* side panels */

  ctx.strokeStyle="#76d8f5";

  ctx.lineWidth=3;

  ctx.strokeRect(
    -34,
    -5,
    68,
    27
  );


  /* wheels */

  ctx.fillStyle="#20292e";

  ctx.beginPath();

  ctx.arc(
    -27,
    31,
    9,
    0,
    Math.PI*2
  );

  ctx.arc(
    27,
    31,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================================
   PLAYER
========================================= */

function drawPlayer(){

  const x=
    laneX(
      currentLane,
      .90
    );


  let y=
    H*.78;


  let jumpY=0;


  if(action==="jump"){

    const remain=
      Math.max(
        0,
        actionEnd-performance.now()
      );


    const progress=
      1-remain/720;


    jumpY=
      Math.sin(
        progress*Math.PI
      )*95;


    y-=jumpY;

  }


  if(action==="slide")
    y+=24;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  const frame=
    Math.sin(
      runTime*.56
    );


  /* shadow */

  ctx.fillStyle="#0006";

  ctx.beginPath();

  ctx.ellipse(
    0,
    66,
    38,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.strokeStyle="#182737";

  ctx.lineWidth=14;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -9,
    18
  );

  ctx.lineTo(
    -23-frame*10,
    54
  );

  ctx.moveTo(
    9,
    18
  );

  ctx.lineTo(
    23+frame*10,
    54
  );

  ctx.stroke();


  /* shoes */

  ctx.strokeStyle="#f4f4f4";

  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    -23-frame*10,
    54
  );

  ctx.lineTo(
    -4-frame*10,
    54
  );

  ctx.moveTo(
    23+frame*10,
    54
  );

  ctx.lineTo(
    43+frame*10,
    54
  );

  ctx.stroke();


  /* shirt */

  let c=
    characters.find(
      x=>x.id===selected
    );


  let shirt=
    c?c.shirt:"#173f73";


  ctx.fillStyle=shirt;

  ctx.beginPath();

  ctx.roundRect(
    -29,
    -34,
    58,
    65,
    18
  );

  ctx.fill();


  /* shirt highlight */

  ctx.fillStyle="#ffffff33";

  ctx.fillRect(
    -22,
    -25,
    44,
    6
  );


  /* neck */

  ctx.fillStyle="#d99d75";

  ctx.fillRect(
    -9,
    -41,
    18,
    15
  );


  /* head */

  if(selected==="doraemon"){

    ctx.fillStyle="#5ca8cf";

  }else{

    ctx.fillStyle="#ffd0aa";

  }


  ctx.beginPath();

  ctx.arc(
    0,
    -63,
    28,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* ears */

  if(selected!=="doraemon"){

    ctx.beginPath();

    ctx.arc(
      -27,
      -62,
      7,
      0,
      Math.PI*2
    );

    ctx.arc(
      27,
      -62,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* hair */

  if(selected!=="doraemon"){

    ctx.fillStyle=
      c?c.hair:"#263a55";


    ctx.beginPath();

    ctx.arc(
      0,
      -75,
      30,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();


    for(
      let i=-2;
      i<=2;
      i++
    ){

      ctx.beginPath();

      ctx.arc(
        i*8,
        -83+
        Math.abs(i)*2,
        9,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  /* doraemon eyes */

  if(selected==="doraemon"){

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
      -10,
      -64,
      9,
      0,
      Math.PI*2
    );

    ctx.arc(
      10,
      -64,
      9,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
      -10,
      -64,
      4,
      0,
      Math.PI*2
    );

    ctx.arc(
      10,
      -64,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* nose */

    ctx.fillStyle="#e33";

    ctx.beginPath();

    ctx.arc(
      0,
      -52,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  else{

    /* eyes */

    ctx.fillStyle="#162331";

    ctx.beginPath();

    ctx.ellipse(
      -10,
      -61,
      4,
      6,
      0,
      0,
      Math.PI*2
    );

    ctx.ellipse(
      10,
      -61,
      4,
      6,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* nose */

    ctx.fillStyle="#d99570";

    ctx.beginPath();

    ctx.arc(
      0,
      -53,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* smile */

  ctx.strokeStyle="#7c3e38";

  ctx.lineWidth=2.5;

  ctx.beginPath();

  ctx.arc(
    0,
    -48,
    9,
    .15,
    Math.PI-.15
  );

  ctx.stroke();


  /* arms */

  const arm=
    Math.sin(
      runTime*.56
    )*13;


  ctx.strokeStyle=
    selected==="doraemon"
    ? "#5ca8cf"
    : "#ffd0aa";

  ctx.lineWidth=13;


  ctx.beginPath();

  ctx.moveTo(
    -23,
    -14
  );

  ctx.lineTo(
    -44,
    7+arm
  );

  ctx.moveTo(
    23,
    -14
  );

  ctx.lineTo(
    44,
    -28-arm
  );

  ctx.stroke();


  /* hands */

  ctx.fillStyle=
    selected==="doraemon"
    ? "#5ca8cf"
    : "#ffd0aa";


  ctx.beginPath();

  ctx.arc(
    -44,
    7+arm,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    44,
    -28-arm,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* DORAEMON BELLY */

  if(selected==="doraemon"){

    ctx.fillStyle="#e9f7fb";

    ctx.beginPath();

    ctx.arc(
      0,
      5,
      15,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =========================================
   CROWD
========================================= */

function drawCrowd(){

  const offset=
    (world*.018)%48;


  for(
    let i=-1;
    i<13;
    i++
  ){

    const x=
      i*(W/11)+offset;

    const y=
      H*.98;


    ctx.fillStyle=
      i%2
      ? "#18252f"
      : "#35424b";


    ctx.beginPath();

    ctx.arc(
      x,
      y-28,
      17,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#ffd0aa";

    ctx.beginPath();

    ctx.arc(
      x,
      y-34,
      9,
      0,
      Math.PI*2
    );

    ctx.fill();


    if(i%3===0){

      ctx.strokeStyle="#ffd0aa";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.moveTo(
        x+9,
        y-23
      );

      ctx.lineTo(
        x+22,
        y-51
      );

      ctx.stroke();

    }

  }

}

   INITIAL DRAW
========================================= */

draw();

</script>

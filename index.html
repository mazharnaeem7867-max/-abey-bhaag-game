<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abey Bhaag!</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79d8f5;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* HUD */
.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;
  display:flex;
  justify-content:space-between;
}

.hudBox{
  background:#102c3d;
  color:#fff;
  padding:7px 10px;
  border:3px solid #fff;
  border-radius:13px;
  font-weight:900;
  box-shadow:0 3px 8px #0005;
}

.pauseBtn{
  position:absolute;
  top:62px;
  left:10px;
  z-index:12;
  width:48px;
  height:45px;
  border:3px solid white;
  border-radius:13px;
  background:#102c3d;
  color:white;
  font-size:20px;
  font-weight:bold;
}

/* Controls */
.controls{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:12;
}

.controls button{
  width:55px;
  height:47px;
  border:3px solid white;
  border-radius:13px;
  background:#102c3d;
  color:white;
  font-size:21px;
  font-weight:900;
}

/* HOME */
.screen{
  position:absolute;
  inset:0;
  z-index:30;
}

#home{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      #56c9ed 0%,
      #cceff8 55%,
      #74858a 56%,
      #56646a 100%
    );
}

.homeBox{
  width:min(420px,94vw);
  text-align:center;
}

.logo{
  font-size:55px;
  line-height:.8;
  font-weight:1000;
  font-style:italic;
  color:#ffd52b;
  text-shadow:
    4px 5px #183142,
    -2px -2px white;
}

.logo span{
  color:#08b9ec;
}

.subtitle{
  display:inline-block;
  margin:18px 0 8px;
  padding:8px 13px;
  background:#f5b526;
  border:3px solid #714600;
  border-radius:12px;
  color:#172d3b;
  font-weight:1000;
}

.coinBar{
  display:inline-block;
  padding:7px 18px;
  margin:5px;
  background:#102c3d;
  border:3px solid white;
  border-radius:20px;
  color:#ffd52b;
  font-weight:1000;
}

.playButton,
.storeButton{
  display:block;
  width:85%;
  margin:9px auto;
  border-radius:30px;
  font-weight:1000;
}

.playButton{
  padding:12px;
  background:linear-gradient(#fff12a,#ff9200);
  border:5px solid white;
  color:#172d3b;
  font-size:30px;
  box-shadow:0 6px #7b4300;
}

.storeButton{
  padding:11px;
  background:#102c3d;
  border:4px solid white;
  color:white;
  font-size:19px;
}

/* STORE */
#store{
  display:none;
  overflow:auto;
  background:linear-gradient(#5bcceb,#e8faff 55%,#64787e);
}

.storeHeader{
  width:min(480px,94vw);
  margin:auto;
  padding:14px 4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.storeHeader h1{
  color:white;
  font-size:25px;
  text-shadow:2px 3px #203542;
}

.backBtn{
  padding:8px 11px;
  border:3px solid white;
  border-radius:12px;
  background:#102c3d;
  color:white;
  font-weight:1000;
}

.storeCoins{
  text-align:center;
  color:#ffc928;
  font-size:22px;
  font-weight:1000;
  margin-bottom:12px;
}

.storeGrid{
  width:min(480px,94vw);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding-bottom:25px;
}

.card{
  background:#102c3dee;
  border:3px solid #70d9ef;
  border-radius:18px;
  padding:8px;
  color:white;
  text-align:center;
}

.card.selected{
  border-color:#5ee852;
  box-shadow:0 0 15px #5ee85288;
}

.preview{
  height:145px;
  border-radius:13px;
  background:linear-gradient(#c6f2fc,#fff);
  position:relative;
  overflow:hidden;
}

.miniShadow{
  position:absolute;
  width:65px;
  height:10px;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:#0003;
  border-radius:50%;
}

.miniHead{
  position:absolute;
  width:52px;
  height:52px;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  border:3px solid #744b38;
}

.miniHair{
  position:absolute;
  width:61px;
  height:38px;
  top:19px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  z-index:2;
}

.miniBody{
  position:absolute;
  width:69px;
  height:68px;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  border-radius:20px 20px 9px 9px;
}

.miniEyes{
  position:absolute;
  z-index:5;
  top:51px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  color:#182733;
}

.card h2{
  font-size:18px;
  margin-top:5px;
}

.price{
  color:#ffd329;
  font-weight:1000;
  margin:5px;
}

.buy{
  width:100%;
  padding:9px;
  border:0;
  border-radius:11px;
  background:linear-gradient(#ffe62d,#ff9000);
  color:#152c3b;
  font-weight:1000;
}

.buy.selected{
  background:#5de451;
}

.buy.locked{
  background:#637681;
  color:white;
}

/* PAUSE */
#pauseMenu,
#gameOver{
  display:none;
  align-items:center;
  justify-content:center;
  background:#0009;
}

.pauseBox,
.overBox{
  width:min(380px,91vw);
  padding:23px;
  background:#102c3d;
  border:4px solid #59d8f4;
  border-radius:22px;
  color:white;
  text-align:center;
}

.pauseBox h1,
.overBox h1{
  color:#ffd42a;
  margin-bottom:14px;
}

.menuBtn{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:3px solid white;
  border-radius:14px;
  font-size:18px;
  font-weight:1000;
}

.resume{background:#59df4d}
.openStore{background:#ffc928}
.homeBtn{background:#536771;color:white}

.restart{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:4px solid white;
  border-radius:17px;
  background:linear-gradient(#fff32b,#ff9000);
  font-size:21px;
  font-weight:1000;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">
  <div class="hudBox">⭐ <span id="score">00000</span></div>
  <div class="hudBox">🪙 <span id="coins">0</span></div>
  <div class="hudBox">🏃 <span id="distance">0</span>m</div>
</div>

<button class="pauseBtn" onclick="pauseGame()">⏸</button>

<div class="controls">
  <button onclick="moveLane(-1)">◀</button>
  <button onclick="jump()">⬆</button>
  <button onclick="slide()">⬇</button>
  <button onclick="moveLane(1)">▶</button>
</div>


<!-- HOME -->

<div id="home" class="screen">

  <div class="homeBox">

    <div class="logo">
      ABEY<br>
      <span>BHAAG!</span>
    </div>

    <div class="subtitle">
      Pakray gaye to Game Over! 🎮
    </div>

    <br>

    <div class="coinBar">
      🪙 <span id="homeCoins">450</span>
    </div>

    <button class="playButton" onclick="startGame()">
      ▶ PLAY
    </button>

    <button class="storeButton" onclick="openStore('home')">
      🏪 CHARACTER STORE
    </button>

  </div>
</div>


<!-- STORE -->

<div id="store" class="screen">

  <div class="storeHeader">
    <button class="backBtn" onclick="closeStore()">← BACK</button>
    <h1>CHARACTER STORE</h1>
  </div>

  <div class="storeCoins">
    🪙 <span id="storeCoins">450</span>
  </div>

  <div class="storeGrid" id="storeGrid"></div>

</div>


<!-- PAUSE -->

<div id="pauseMenu" class="screen">

  <div class="pauseBox">

    <h1>GAME PAUSED</h1>

    <button class="menuBtn resume" onclick="resumeGame()">
      ▶ RESUME
    </button>

    <button class="menuBtn openStore"
            onclick="openStore('game')">
      🏪 CHARACTER STORE
    </button>

    <button class="menuBtn homeBtn"
            onclick="goHome()">
      🏠 HOME
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="screen">

  <div class="overBox">

    <h1>GAME OVER!</h1>

    <p>Train/obstacle se takra gaye 😱</p>

    <p style="margin-top:12px">
      ⭐ Score: <b id="finalScore">0</b>
    </p>

    <p style="margin-top:5px">
      🪙 Coins: <b id="finalCoins">0</b>
    </p>

    <button class="restart" onclick="startGame()">
      🔄 RUN AGAIN
    </button>

    <button class="menuBtn openStore"
            onclick="openStore('gameover')">
      🏪 STORE
    </button>

  </div>

</div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,DPR;

function resize(){

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =====================================================
   CHARACTERS
===================================================== */

const characters=[

  {
    id:"runner",
    name:"Street Runner",
    price:0,
    skin:"#f2b894",
    hair:"#292421",
    shirt:"#e93636",
    pants:"#202b36",
    shoe:"#f4f4f4"
  },

  {
    id:"doraemon",
    name:"Doraemon",
    price:450,
    skin:"#62b8e1",
    hair:"#62b8e1",
    shirt:"#168bc7",
    pants:"#168bc7",
    shoe:"#ffffff"
  },

  {
    id:"mrbeast",
    name:"Mr Beast",
    price:1000,
    skin:"#efb18d",
    hair:"#49321f",
    shirt:"#158bd0",
    pants:"#202b36",
    shoe:"#ffffff"
  },

  {
    id:"ronaldo",
    name:"Ronaldo",
    price:2000,
    skin:"#d99b77",
    hair:"#1d2024",
    shirt:"#d73333",
    pants:"#20252b",
    shoe:"#eeeeee"
  }
];


/* =====================================================
   START BONUS
===================================================== */

let wallet=450;

let savedCoins=localStorage.getItem("abeyCoins");

if(savedCoins!==null){
  wallet=Number(savedCoins);
}

let owned=JSON.parse(
  localStorage.getItem("abeyOwned")||
  '["runner"]'
);

let selected=
  localStorage.getItem("abeySelected")||
  "runner";


/* =====================================================
   SAVE
===================================================== */

function save(){

  localStorage.setItem(
    "abeyCoins",
    wallet
  );

  localStorage.setItem(
    "abeyOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "abeySelected",
    selected
  );

  updateWallet();
}

function updateWallet(){

  document.getElementById(
    "homeCoins"
  ).textContent=wallet;

  document.getElementById(
    "storeCoins"
  ).textContent=wallet;
}


/* =====================================================
   STORE
===================================================== */

let returnTo="home";

function openStore(from){

  returnTo=from;

  paused=true;

  document.getElementById("home").style.display="none";
  document.getElementById("pauseMenu").style.display="none";
  document.getElementById("gameOver").style.display="none";

  document.getElementById("store").style.display="block";

  renderStore();
}

function closeStore(){

  document.getElementById("store").style.display="none";

  if(returnTo==="game"){

    document.getElementById("pauseMenu").style.display="flex";

  }
  else if(returnTo==="gameover"){

    document.getElementById("gameOver").style.display="flex";

  }
  else{

    document.getElementById("home").style.display="flex";

  }

  updateWallet();
}

function renderStore(){

  const grid=document.getElementById("storeGrid");

  grid.innerHTML="";

  characters.forEach(c=>{

    const isOwned=owned.includes(c.id);
    const isSelected=selected===c.id;

    const card=document.createElement("div");

    card.className=
      "card"+
      (isSelected?" selected":"");

    card.innerHTML=`

      <div class="preview">

        <div class="miniShadow"></div>

        <div class="miniHair"
             style="background:${c.hair}">
        </div>

        <div class="miniHead"
             style="background:${c.skin}">
        </div>

        <div class="miniEyes">
          ●　●
        </div>

        <div class="miniBody"
             style="background:${c.shirt}">
        </div>

      </div>

      <h2>${c.name}</h2>

      <div class="price">
        ${isOwned?"OWNED":"🪙 "+c.price}
      </div>

      <button class="buy ${
        isSelected
        ?"selected"
        :!isOwned
        ?"locked"
        :""
      }">

      ${
        isSelected
        ?"✓ SELECTED"
        :isOwned
        ?"SELECT"
        :"🪙 BUY"
      }

      </button>
    `;

    card.querySelector(".buy").onclick=()=>{

      if(!isOwned){

        if(wallet<c.price){

          alert(
            "Coins kam hain! 🪙"
          );

          return;
        }

        wallet-=c.price;

        owned.push(c.id);

        selected=c.id;

        save();

        renderStore();

        return;
      }

      selected=c.id;

      save();

      renderStore();
    };

    grid.appendChild(card);
  });
}

updateWallet();


/* =====================================================
   GAME
===================================================== */

let running=false;
let paused=false;

let score=0;
let collectedCoins=0;
let distance=0;

let world=0;
let speed=.0046;

let objects=[];
let spawnTimer=0;

let currentLane=1;
let targetLane=1;

let action="";
let actionStart=0;
let actionEnd=0;

let runTime=0;

let lastTime=0;
let animation;


/* =====================================================
   START
===================================================== */

function startGame(){

  document.getElementById("home").style.display="none";
  document.getElementById("store").style.display="none";
  document.getElementById("pauseMenu").style.display="none";
  document.getElementById("gameOver").style.display="none";

  running=true;
  paused=false;

  score=0;
  collectedCoins=0;
  distance=0;

  world=0;
  speed=.0046;

  objects=[];

  spawnTimer=20;

  currentLane=1;
  targetLane=1;

  action="";

  runTime=0;

  lastTime=performance.now();

  cancelAnimationFrame(animation);

  animation=requestAnimationFrame(loop);
}


/* =====================================================
   LOOP
===================================================== */

function loop(now){

  if(!running)return;

  const dt=Math.min(
    2,
    (now-lastTime)/16.67
  );

  lastTime=now;

  if(!paused){

    update(dt,now);
    draw();

  }

  animation=requestAnimationFrame(loop);
}


/* =====================================================
   PAUSE
===================================================== */

function pauseGame(){

  if(!running)return;

  paused=true;

  document.getElementById(
    "pauseMenu"
  ).style.display="flex";
}

function resumeGame(){

  paused=false;

  document.getElementById(
    "pauseMenu"
  ).style.display="none";

  lastTime=performance.now();
}

function goHome(){

  running=false;
  paused=false;

  document.getElementById("pauseMenu").style.display="none";
  document.getElementById("store").style.display="none";
  document.getElementById("gameOver").style.display="none";
  document.getElementById("home").style.display="flex";

  updateWallet();
}


/* =====================================================
   CONTROLS
===================================================== */

function moveLane(dir){

  if(!running||paused)return;

  targetLane+=dir;

  targetLane=Math.max(
    0,
    Math.min(2,targetLane)
  );
}

function jump(){

  if(!running||paused||action)return;

  action="jump";

  actionStart=performance.now();

  actionEnd=
    actionStart+
    760;
}

function slide(){

  if(!running||paused||action)return;

  action="slide";

  actionStart=performance.now();

  actionEnd=
    actionStart+
    700;
}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft")
    moveLane(-1);

  if(e.key==="ArrowRight")
    moveLane(1);

  if(e.key==="ArrowUp"||e.key===" ")
    jump();

  if(e.key==="ArrowDown")
    slide();

  if(e.key==="Escape")
    pauseGame();

});


/* =====================================================
   SWIPE
===================================================== */

let touchX=0;
let touchY=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  e=>{

    const t=e.changedTouches[0];

    const dx=t.clientX-touchX;
    const dy=t.clientY-touchY;

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<25
    )return;

    if(Math.abs(dx)>Math.abs(dy))
      moveLane(dx>0?1:-1);

    else if(dy<0)
      jump();

    else
      slide();

  },
  {passive:true}
);


/* =====================================================
   UPDATE
===================================================== */

function update(dt,now){

  runTime+=dt;

  /* slower, smoother world */

  world+=speed*100*dt;

  /* difficulty gradually increases */

  speed=Math.min(
    .0105,
    speed+.0000009*dt
  );

  /* smooth lane movement */

  currentLane+=
    (targetLane-currentLane)
    *.14*dt;


  /* slow natural running animation */

  if(action && now>actionEnd)
    action="";


  score+=Math.floor(.9*dt);

  distance+=
    Math.floor(
      speed*12*dt
    );


  /* spawn */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnObject();

    spawnTimer=
      48+
      Math.random()*26-
      speed*500;

    spawnTimer=Math.max(
      32,
      spawnTimer
    );
  }


  /* objects */

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o=objects[i];

    o.z+=speed*dt;

    if(
      o.z>.78 &&
      o.z<1.02 &&
      Math.abs(
        o.lane-currentLane
      )<.25 &&
      !o.checked
    ){

      o.checked=true;

      if(o.type==="coin"){

        collectedCoins++;

        objects.splice(i,1);

        continue;
      }

      let safe=false;

      if(
        o.type==="barrier"&&
        action==="jump"
      )
        safe=true;

      if(
        o.type==="lowbar"&&
        action==="slide"
      )
        safe=true;

      if(
        o.type==="train"&&
        action==="jump"
      )
        safe=true;

      if(!safe){

        gameOver();

        return;
      }
    }

    if(o.z>1.15)
      objects.splice(i,1);
  }


  document.getElementById("score")
    .textContent=
    String(score).padStart(5,"0");

  document.getElementById("coins")
    .textContent=
    collectedCoins;

  document.getElementById("distance")
    .textContent=
    distance;
}


/* =====================================================
   OBJECT SPAWN
===================================================== */

function spawnObject(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  const r=Math.random();

  let type;

  if(r<.45)
    type="coin";
  else if(r<.68)
    type="barrier";
  else if(r<.84)
    type="train";
  else
    type="lowbar";


  objects.push({
    type,
    lane,
    z:-.06,
    checked:false,
    spin:Math.random()*10
  });


  if(type==="coin"){

    for(let i=1;i<5;i++){

      objects.push({
        type:"coin",
        lane,
        z:-.06-i*.07,
        checked:false,
        spin:i
      });

    }
  }
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running=false;

  wallet+=collectedCoins;

  save();

  document.getElementById(
    "finalScore"
  ).textContent=score;

  document.getElementById(
    "finalCoins"
  ).textContent=collectedCoins;

  document.getElementById(
    "gameOver"
  ).style.display="flex";
}


/* =====================================================
   PERSPECTIVE
===================================================== */

function roadY(z){

  return H*.39+
    (H*.98-H*.39)*z;
}

function roadWidth(z){

  return W*.14+
    (W*.82-W*.14)*z;
}

function laneX(lane,z){

  return W/2+
    (lane-1)*
    roadWidth(z)*.62;
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawSky();
  drawCity();
  drawRoad();
  drawRails();
  drawLights();
  drawFans();
  drawObjects();
  drawPlayer();
}


/* =====================================================
   SKY
===================================================== */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H*.55
    );

  g.addColorStop(
    0,
    "#35bde9"
  );

  g.addColorStop(
    1,
    "#e1f7fb"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* sun */

  ctx.fillStyle="#ffe36c";

  ctx.beginPath();

  ctx.arc(
    W*.83,
    H*.12,
    29,
    0,
    Math.PI*2
  );

  ctx.fill();


  cloud(
    W*.18,
    H*.13,
    1
  );

  cloud(
    W*.57,
    H*.21,
    .75
  );
}

function cloud(x,y,s){

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    18*s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+22*s,
    y-8*s,
    23*s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+47*s,
    y,
    18*s,
    0,
    Math.PI*2
  );

  ctx.fill();
}

  );

    H
  );

  ctx.closePath();

  ctx.fill();


  /*

  */

  ctx.fillStyle="#343b41";

  ctx.beginPath();

  ctx.moveTo(
    W*.29,
    horizon
  );

  ctx.lineTo(
    W*.71,
    horizon
  );

  ctx.lineTo(
    W*1.08,
    H
  );

  ctx.lineTo(
    -W*.08,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* road edge lines */

  ctx.strokeStyle="#f5f5f5";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    W*.29,
    horizon
  );

  ctx.lineTo(
    -W*.08,
    H
  );

  ctx.moveTo(
    W*.71,
    horizon
  );

  ctx.lineTo(
    W*1.08,
    H
  );

  ctx.stroke();


  /*
    Subway-style lane markings
    move toward player
  */

  for(
    const side of [-1,1]
  ){

    for(
      let i=0;
      i<18;
      i++
    ){

      const z=
        (i*.075+
        world*.0015)%1;

      const y=
        roadY(z);

      const x=
        W/2+
        side*
        roadWidth(z)*.31;

      const markW=
        3+z*4;

      const markH=
        5+z*28;

      ctx.fillStyle="#f3f3f3";

      ctx.fillRect(
        x-markW/2,
        y,
        markW,
        markH
      );
    }

  /* asphalt subtle strips */

  for(let i=0;i<8;i++){

    const z=
      (i*.13+
      world*.0008)%1;

    const y=roadY(z);

    ctx.strokeStyle="#ffffff0c";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      W/2-roadWidth(z)*.5,

    );

    ctx.lineTo(
      W/2+roadWidth(z)*.5,
      y
    );

    ctx.stroke();
  }
}

/* =====================================================
   LIGHTS
===================================================== */

function drawLights(){

  const offset=
    (world*.06)%115;

  for(
    let i=-2;
    i<9;
    i++
  ){

    const y=
      H*.42+
      i*115+
      offset;

    if(
      y<H*.43||
      y>H
    )continue;

    const z=
      Math.min(
        1,
        Math.max(
          .1,
          (y-H*.42)/(H*.58)
        )
      );

    drawLamp(
      24,
      y,
      .35+z*.8
    );

    drawLamp(
      W-24,
      y+20,
      .35+z*.8
    );
  }
}

    Math.sin(
      runTime*.035+
      index
    )*8;

  ctx.strokeStyle="#e5b08e";

  ctx.lineWidth=7;

/* =====================================================

function drawObjects(){

  objects
  .slice()
  .sort(
    (a,b)=>a.z-b.z
  )
  .forEach(o=>{

    const z=
      Math.max(
        0,
        Math.min(
          1,
          o.z
        )
      );

    const x=
      laneX(
        o.lane,
        z
      );

    const y=
      roadY(z);

    const scale=
      .25+
      z*1.22;

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.scale(
      scale,
      scale
    );

    if(o.type==="coin")
      drawCoin(o);

    if(o.type==="barrier")
      drawBarrier();

    if(o.type==="train")
      drawTrain();

    if(o.type==="lowbar")
      drawLowbar();

    ctx.restore();
  });
}

    characters.find(
      x=>x.id===selected
    )||
    characters[0];


  /*
    MUCH SLOWER RUN CYCLE

    Old:
    extremely fast arm/leg movement.

    New:
    smooth 2D cartoon running.
  */

  const cycle=
    runTime*.075;


  const leg=
    Math.sin(cycle)*
    18;

  const leg2=
    Math.sin(cycle+Math.PI)*
    18;

  const arm=
    Math.sin(cycle+Math.PI)*
    12;

  const arm2=
    Math.sin(cycle)*
    12;


  let jumpY=0;

  if(action==="jump"){

    const p=
      Math.min(
        1,
        Math.max(
          0,
          (performance.now()-actionStart)/

      Math.sin(

    ctx.beginPath();

    ctx.moveTo(
      -16,
      -76
    );

    ctx.lineTo(
      -6,
      -78
    );

    ctx.moveTo(
      6,
      -78
    );

    ctx.lineTo(
      16,
      -76
    );

    ctx.stroke();


    /* smile */

    ctx.strokeStyle="#713d37";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
      0,
      -53,
      10,
      .1,
      Math.PI-.1
    );

    ctx.stroke();
  }


  /*
    ARMS

    Deliberately slow and small movement.
  */

  ctx.strokeStyle=c.skin;

  ctx.lineWidth=12;

  ctx.lineCap="round";

  if(crouch){

    ctx.beginPath();

    ctx.moveTo(
      -23,
      -8
    );

    ctx.lineTo(
      -38,
      17
    );

    ctx.moveTo(
      23,
      -8
    );

    ctx.lineTo(
      38,
      17
    );

    ctx.stroke();

  }else{

    ctx.beginPath();

    ctx.moveTo(
      -23,
      -14
    );

    ctx.lineTo(
      -40,
      4+arm*.45
    );

    ctx.moveTo(
      23,
      -14
    );

    ctx.lineTo(
      40,
      -2-arm2*.45
    );

    ctx.stroke();
  }


  /* hands */

  ctx.fillStyle=c.skin;

  ctx.beginPath();

  ctx.arc(
    -40,
    4+arm*.45,
    6,
    0,
    Math.PI*2
  );

  ctx.arc(
    40,
    -2-arm2*.45,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    DORAEMON BODY DETAILS
  */

  if(c.id==="doraemon"){

    ctx.fillStyle="#eefcff";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      17,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="#4599bc";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      5,
      11,
      0,
      Math.PI
    );

    ctx.stroke();
  }


  ctx.restore();
}


/* =====================================================
   INITIAL DRAW
===================================================== */

draw();

</script>
